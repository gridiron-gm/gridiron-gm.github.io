<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gridiron GM</title>
<meta name="description" content="Gridiron GM: a pro football franchise sim with real rosters and contracts.">
<meta name="theme-color" content="#04070d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 36%27%3E%3Cpath d=%27M16 0L32 4.7V22.7L16 36L0 22.7V4.7Z%27 fill=%27%23d4941a%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27Arial%27 font-weight=%27900%27 font-size=%2714%27 text-anchor=%27middle%27 fill=%27%232a1800%27%3EGM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,600;1,700;1,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<style>
/* Gridiron GM: game-style franchise menus. Team colors arrive as --tc1 (primary), --tc2 (secondary), --on-tc1/--on-tc2 (text on them). */
:root {
  --bg0: #04070d;
  --panel: rgba(9, 15, 27, .86);
  --panel-hi: rgba(18, 28, 46, .94);
  --solid: #0a111e;
  --line: rgba(255, 255, 255, .09);
  --line2: rgba(255, 255, 255, .18);
  --txt: #eef2f8;
  --muted: #9aa7ba;
  --dim: #6b7990;
  --good: #3ddc97;
  --warn: #ffb547;
  --bad: #ff5a6a;
  --display: 'Barlow Condensed', 'Oswald', 'Arial Narrow', sans-serif;
  --cut: 16px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg0); color: var(--txt); font: 15px/1.45 Inter, -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
.muted { color: var(--muted); }
.dim { color: var(--dim); }
.small { font-size: 12.5px; }
.good { color: var(--good); } .bad, .neg { color: var(--bad); } .warnc { color: var(--warn); }
em.ap { font-style: normal; font-size: 11px; color: var(--muted); letter-spacing: .02em; text-transform: none; font-family: Inter, sans-serif; font-weight: 500; }
select, input { font: inherit; color: var(--txt); background: rgba(255, 255, 255, .06); border: 1px solid var(--line2); border-radius: 0; padding: 9px 12px; }
input[type=number] { width: 100%; }
option { background: #0a111e; color: var(--txt); }
:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

/* ---------- full-bleed team background ---------- */
.app {
  position: relative; min-height: 100vh; overflow-x: hidden; background-color: var(--bg0);
  background-image:
    repeating-linear-gradient(-62deg, rgba(255, 255, 255, .03) 0 1px, transparent 1px 15px),
    linear-gradient(118deg, transparent 0 63%, color-mix(in srgb, var(--tc2) 30%, transparent) 63% 64.6%, transparent 64.6% 67.4%, color-mix(in srgb, var(--tc2) 18%, transparent) 67.4% 68%, transparent 68%),
    radial-gradient(1100px 620px at 88% -8%, color-mix(in srgb, var(--tc1) 70%, #ffffff 8%), transparent 62%),
    linear-gradient(180deg, var(--tc1) 0, color-mix(in srgb, var(--tc1) 50%, var(--bg0)) 460px, var(--bg0) 1100px);
  background-repeat: no-repeat; background-size: 100% 1400px;
}

/* ---------- header ---------- */
.top { display: flex; align-items: center; gap: 22px; padding: 22px 32px 0; }
.brand { font: 800 italic 16px/1 var(--display); letter-spacing: .12em; color: rgba(255, 255, 255, .55); text-transform: uppercase; writing-mode: vertical-rl; transform: rotate(180deg); border-left: 3px solid var(--tc2b); padding-left: 6px; white-space: nowrap; }
.tbadge { width: 72px; height: 64px; flex: none; display: grid; place-items: center; background: var(--tc2d); color: #fff;
  font: 800 italic 30px/1 var(--display); clip-path: polygon(16% 0, 100% 0, 84% 100%, 0 100%); box-shadow: 0 0 0 2px #fff inset; }
.teamname { min-width: 0; }
.teamname h1 { margin: 0; font: 800 italic 44px/.92 var(--display); text-transform: uppercase; letter-spacing: .005em; }
.teamname div { margin-top: 6px; font: 600 14px/1 var(--display); text-transform: uppercase; letter-spacing: .14em; color: rgba(255, 255, 255, .72); }
.topstats { margin-left: auto; display: flex; gap: 6px; }
.tstat { padding: 8px 18px 8px 16px; background: rgba(0, 0, 0, .32); clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); min-width: 116px; }
.tstat > span { display: block; font: 600 11px/1.2 Inter, sans-serif; color: rgba(255, 255, 255, .62); text-transform: uppercase; letter-spacing: .08em; white-space: nowrap; }
.tstat > b { display: flex; align-items: center; gap: 8px; min-height: 38px; font: 700 30px/1.05 var(--display); white-space: nowrap; }
.tstat > b small { font: 600 15px var(--display); color: rgba(255, 255, 255, .55); }
.tstat .lbl-s { display: none; }
.adv { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
.adv .btn { justify-content: center; }

/* ---------- season timeline ---------- */
.timeline { display: flex; gap: 3px; margin: 20px 32px 0; }
.tl { flex: 1; min-width: 0; padding: 9px 18px 9px 24px; background: rgba(0, 0, 0, .38); color: rgba(255, 255, 255, .7);
  clip-path: polygon(0 0, calc(100% - 13px) 0, 100% 50%, calc(100% - 13px) 100%, 0 100%, 13px 50%); }
.tl:first-child { padding-left: 16px; clip-path: polygon(0 0, calc(100% - 13px) 0, 100% 50%, calc(100% - 13px) 100%, 0 100%); }
.tl b { display: block; font: 700 17px/1.1 var(--display); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl small { display: block; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: rgba(255, 255, 255, .55); }
.tl.now { background: var(--tc2d); color: #fff; }
.tl.now small { color: inherit; opacity: .92; font-weight: 600; }
.tl.next { background: rgba(255, 255, 255, .12); color: #fff; }
.tl.next small { color: #fff; }
.tl.done { color: rgba(255, 255, 255, .4); }
.tlc { display: none; }

/* ---------- nav tabs ---------- */
.tabs { display: flex; align-items: flex-end; gap: 2px; margin: 18px 32px 0; border-bottom: 2px solid rgba(255, 255, 255, .14); flex-wrap: wrap; }
.tab { position: relative; padding: 10px 16px 11px; background: none; border: 0; cursor: pointer; color: rgba(255, 255, 255, .62);
  font: 700 19px/1 var(--display); text-transform: uppercase; letter-spacing: .06em; transition: color .15s; }
.tab:hover { color: #fff; }
.tab.on { color: #fff; }
.tab.on::after { content: ''; position: absolute; left: 12px; right: 12px; bottom: -2px; height: 4px; background: var(--tc2b); transform: skewX(-24deg); }
.tabsep { margin: 0 4px 0 18px; padding-bottom: 12px; font: 600 11px/1 Inter, sans-serif; text-transform: uppercase; letter-spacing: .12em; color: var(--tc2b); white-space: nowrap; }
.tab.ph { color: #fff; }
.tab.ph::before { content: ''; display: inline-block; width: 7px; height: 7px; margin: 0 8px 3px 0; background: var(--tc2b); transform: skewX(-20deg); }

.msg { margin: 16px 32px 0; padding: 11px 16px; background: rgba(61, 220, 151, .12); border-left: 4px solid var(--good); color: #c9f7e2; max-width: 1376px; }
.msg.bad { background: rgba(255, 90, 106, .12); border-color: var(--bad); color: #ffd0d5; }

main { padding: 26px 32px 56px; max-width: 1440px; }
main.enter { animation: enter .38s var(--ease) both; }
@keyframes enter { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
.h2 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin: 0 0 16px; }
.h2 h2 { margin: 0; font: 800 italic 34px/1 var(--display); text-transform: uppercase; letter-spacing: .01em; }
.h2 > span { color: var(--muted); font-size: 13px; }
.h2 .btns { margin-left: auto; }
.note { color: var(--muted); font-size: 13px; max-width: 900px; }

/* ---------- panels and tiles ---------- */
.panel { position: relative; background: var(--panel); border-top: 1px solid var(--line2);
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%); }
.pad { padding: 20px 22px; }
.ttl { font: 700 22px/1 var(--display); text-transform: uppercase; letter-spacing: .05em; margin: 0; }
.kick { font: 700 13px/1 var(--display); text-transform: uppercase; letter-spacing: .18em; color: var(--tc2b); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

.hub { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; }
.hero { position: relative; grid-column: span 8; min-height: 316px; padding: 34px 38px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end;
  background:
    repeating-linear-gradient(-62deg, rgba(255, 255, 255, .05) 0 2px, transparent 2px 11px) 0 0 / 46% 100% no-repeat,
    linear-gradient(112deg, color-mix(in srgb, var(--tc2d) 88%, #000) 0 56%, transparent 56% 57.4%, color-mix(in srgb, var(--tc2d) 55%, #000) 57.4% 59%, transparent 59%),
    linear-gradient(180deg, rgba(10, 18, 32, .7), rgba(4, 7, 13, .95));
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 26px), calc(100% - 26px) 100%, 0 100%); }
.hero.bad { background:
    repeating-linear-gradient(-62deg, rgba(255, 255, 255, .05) 0 2px, transparent 2px 11px) 0 0 / 46% 100% no-repeat,
    linear-gradient(112deg, #7a1420 0 56%, transparent 56% 57.4%, #4d0d15 57.4% 59%, transparent 59%), linear-gradient(180deg, rgba(10, 18, 32, .7), rgba(4, 7, 13, .95)); }
.hero .kick { color: #fff; opacity: .85; }
.hero h3 { position: relative; margin: 10px 0 10px; max-width: 58%; font: 800 italic 50px/.92 var(--display); text-transform: uppercase; }
.hero p { position: relative; margin: 0 0 22px; max-width: 52%; color: rgba(255, 255, 255, .88); }
.hero .btns { position: relative; }
.hero .ghost { position: absolute; right: -10px; top: 6px; max-width: 46%; overflow: hidden; white-space: nowrap; font: 800 italic 200px/.8 var(--display); text-transform: uppercase; color: transparent; -webkit-text-stroke: 2px rgba(255, 255, 255, .09); letter-spacing: -.02em; pointer-events: none; }
.hero .star { position: absolute; right: 52px; bottom: 44px; display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 34%; text-align: center; }
.hero .star .nm { font: 700 26px/1 var(--display); text-transform: uppercase; }
.hero .star .nm small { display: block; margin-top: 4px; font: 600 13px var(--display); letter-spacing: .14em; color: var(--muted); }
.hero .big { position: absolute; right: 54px; bottom: 50px; font: 800 italic 110px/.85 var(--display); color: rgba(255, 255, 255, .92); text-align: right; }
.hero .big small { display: block; margin-top: 6px; font: 700 15px/1.2 var(--display); letter-spacing: .14em; color: var(--muted); font-style: normal; }

.btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 26px 12px 22px; border: 0; cursor: pointer;
  font: 700 18px/1 var(--display); text-transform: uppercase; letter-spacing: .08em; background: rgba(255, 255, 255, .1); color: #fff;
  clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); transition: transform .15s var(--ease), background .15s, filter .15s; white-space: nowrap; }
.btn:hover { background: rgba(255, 255, 255, .18); transform: translateY(-1px); }
.btn:active { transform: scale(.97); }
.btn.pri { background: #fff; color: #0a0f18; }
.btn.pri:hover { background: #fff; filter: brightness(.9); }
.btn.acc { background: var(--tc2d); color: #fff; }
.btn.acc:hover { background: var(--tc2d); filter: brightness(1.12); }
.btn.danger { background: rgba(255, 90, 106, .16); color: #ff9ea8; }
.btn.danger:hover { background: rgba(255, 90, 106, .28); }
.btn.sm { padding: 8px 16px 8px 14px; font-size: 15px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.link { background: none; border: 0; padding: 0; cursor: pointer; color: #fff; font-weight: 600; text-decoration: underline; text-decoration-color: rgba(255, 255, 255, .35); text-underline-offset: 3px; }
.link:hover { text-decoration-color: #fff; }

.tile { grid-column: span 4; display: flex; flex-direction: column; padding: 20px 22px 18px; cursor: pointer; transition: transform .2s var(--ease), background .2s; }
.tile.w8 { grid-column: span 8; } .tile.w12 { grid-column: span 12; }
.tile::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--tc2b); transition: width .2s var(--ease); }
.tile:hover { transform: translateY(-3px); background: var(--panel-hi); }
.tile:hover::before { width: 7px; }
.tile:active { transform: scale(.985); }
.tile.static { cursor: default; } .tile.static:hover { transform: none; background: var(--panel); } .tile.static:hover::before { width: 4px; }
.tile-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.tile-h .big { font: 800 34px/.9 var(--display); text-align: right; white-space: nowrap; }
.tile-h .big small { display: block; font: 600 11px/1.4 Inter, sans-serif; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.tile .go { margin-top: auto; padding-top: 14px; font: 700 14px var(--display); text-transform: uppercase; letter-spacing: .14em; color: var(--muted); transition: color .15s, letter-spacing .2s var(--ease); }
.tile:hover .go { color: #fff; letter-spacing: .2em; }
.tile.ph::after { content: 'This phase'; position: absolute; right: 0; top: 0; padding: 4px 12px 4px 16px; background: var(--tc2d); color: #fff; font: 700 11px/1.2 var(--display); text-transform: uppercase; letter-spacing: .14em; clip-path: polygon(8px 0, 100% 0, 100% 100%, 0 100%); }
.tile.ph .tile-h .big { margin-top: 16px; }
.mini { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); }
.mini:first-child { border-top: 0; }
.mini .nm { font: 700 17px/1.05 var(--display); text-transform: uppercase; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini .nm small { display: block; font: 500 12px Inter, sans-serif; text-transform: none; color: var(--muted); }
.mini .val { font: 700 17px var(--display); text-align: right; white-space: nowrap; }
.mini .val small { display: block; font: 500 11px Inter, sans-serif; color: var(--muted); }
.todo { margin: 0; padding: 0; list-style: none; font-size: 13.5px; }
.todo li { position: relative; padding: 8px 0 8px 18px; border-top: 1px solid var(--line); }
.todo li:first-child { border-top: 0; }
.todo li::before { content: ''; position: absolute; left: 0; top: 14px; width: 8px; height: 8px; background: var(--tc2b); transform: skewX(-20deg); }
.todo li.bad { color: #ffc2c8; } .todo li.bad::before { background: var(--bad); }

.capbar { display: flex; height: 12px; margin: 14px 0 10px; background: rgba(255, 255, 255, .06); transform: skewX(-18deg); overflow: hidden; }
.capbar i { display: block; height: 100%; }
.capbar .u { background: linear-gradient(90deg, #4f7fd9, #7aa2f0); } .capbar .d { background: var(--bad); } .capbar .f { background: var(--good); }
.cblegend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
.cblegend i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; transform: skewX(-18deg); }
.kv { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.kv b { font: 700 18px/1.1 var(--display); white-space: nowrap; }
.kv.sub { border-top: 0; padding-top: 0; font-size: 12px; color: var(--muted); }
.unit { display: grid; grid-template-columns: 70px 1fr 44px; align-items: center; gap: 10px; padding: 6px 0; }
.unit span { font: 700 14px var(--display); letter-spacing: .1em; color: var(--muted); }
.unit .bar { height: 8px; background: rgba(255, 255, 255, .07); transform: skewX(-18deg); }
.unit .bar i { display: block; height: 100%; background: var(--tc2b); }
.unit b { font: 800 22px var(--display); text-align: right; }
.stand { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 14px; align-items: center; font-size: 13.5px; }
.stand .h { font: 600 11px Inter, sans-serif; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
.stand .me { color: #fff; font-weight: 700; }
.chip { display: inline-block; width: 10px; height: 16px; margin-right: 8px; vertical-align: -3px; transform: skewX(-16deg); border-right: 3px solid; }
.tl-team { white-space: nowrap; }
.tokens { display: flex; flex-wrap: wrap; gap: 6px; }
.token { padding: 5px 12px; background: rgba(255, 255, 255, .07); border: 1px dashed var(--line2); font: 700 15px/1 var(--display); letter-spacing: .06em; white-space: nowrap; }
.token.r1 { border-style: solid; border-color: var(--tc2b); background: color-mix(in srgb, var(--tc2) 22%, transparent); }
.newsl { margin: 0; padding: 0; list-style: none; font-size: 13.5px; }
.newsl li { padding: 8px 0; border-top: 1px solid var(--line); }
.newsl li:first-child { border-top: 0; }
.newsl .when { display: block; font: 700 12px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }

/* ---------- rating shield ---------- */
.shield { --s: 54px; position: relative; flex: none; display: inline-grid; place-items: center; width: var(--s); height: calc(var(--s) * 1.12); vertical-align: middle;
  clip-path: polygon(50% 0, 100% 13%, 100% 63%, 50% 100%, 0 63%, 0 13%); background: var(--sh-edge); }
.shield::before { content: ''; position: absolute; inset: max(2px, calc(var(--s) * .05)); clip-path: polygon(50% 0, 100% 13%, 100% 63%, 50% 100%, 0 63%, 0 13%); background: var(--sh-fill); }
.shield::after { content: ''; position: absolute; inset: 0; clip-path: polygon(50% 0, 100% 13%, 100% 40%, 0 58%, 0 13%); background: linear-gradient(180deg, rgba(255, 255, 255, .22), rgba(255, 255, 255, 0)); }
.shield > span { position: relative; z-index: 1; margin-top: -9%; font: 800 calc(var(--s) * .52)/1 var(--display); color: var(--sh-ink); letter-spacing: -.01em; }
.t90 { --sh-edge: #fff1b8; --sh-fill: linear-gradient(165deg, #ffe48a, #d4941a); --sh-ink: #2a1800; }
.t80 { --sh-edge: #a6f3cd; --sh-fill: linear-gradient(165deg, #3ccf8e, #14724b); --sh-ink: #fff; }
.t70 { --sh-edge: #b2d0ff; --sh-fill: linear-gradient(165deg, #4589e6, #1d4c96); --sh-ink: #fff; }
.t60 { --sh-edge: #a6b0be; --sh-fill: linear-gradient(165deg, #5f6a7c, #394252); --sh-ink: #fff; }
.t50 { --sh-edge: #4d5667; --sh-fill: linear-gradient(165deg, #2e3644, #1c222c); --sh-ink: #a6b0be; }
.tc90 { --tier: #f2c14e; } .tc80 { --tier: #3ccf8e; } .tc70 { --tier: #4589e6; } .tc60 { --tier: #7d889a; } .tc50 { --tier: #3a4352; }

.dev { display: inline-block; padding: 3px 9px 2px; font: 700 13px/1.15 var(--display); text-transform: uppercase; letter-spacing: .1em; transform: skewX(-12deg); white-space: nowrap; }
.dev-elite { background: linear-gradient(165deg, #ffe48a, #d4941a); color: #2a1800; }
.dev-fast { background: rgba(60, 207, 142, .18); color: #6fe8b0; }
.dev-normal { background: rgba(255, 255, 255, .08); color: #c9d2de; }
.dev-slow { color: var(--dim); box-shadow: inset 0 0 0 1px var(--line2); }
.dev-unknown { color: var(--muted); outline: 1px dashed var(--line2); outline-offset: -1px; }
.pot { display: inline-flex; align-items: baseline; gap: 5px; font: 600 12px Inter, sans-serif; color: var(--muted); letter-spacing: .04em; white-space: nowrap; }
.pot b { font: 800 17px/1 var(--display); color: #fff; letter-spacing: 0; }
.slot { display: inline-block; padding: 2px 8px 1px; background: #fff; color: #0a0f18; font: 800 13px/1.2 var(--display); letter-spacing: .06em; transform: skewX(-12deg); white-space: nowrap; }
.inj { display: inline-block; padding: 2px 8px 1px; background: rgba(255, 90, 106, .2); color: #ff9ea8; font: 700 12px/1.2 var(--display); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }

/* ---------- filters ---------- */
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 18px; }
.fchip { padding: 8px 16px; border: 0; background: rgba(255, 255, 255, .07); cursor: pointer; font: 700 15px/1 var(--display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
  clip-path: polygon(7px 0, 100% 0, calc(100% - 7px) 100%, 0 100%); transition: background .15s, color .15s; white-space: nowrap; flex: none; }
.fchip:hover { background: rgba(255, 255, 255, .14); color: #fff; }
.fchip.on { background: #fff; color: #0a0f18; }
.seg { margin-left: auto; display: flex; gap: 2px; align-items: center; }
.seg .fchip { clip-path: none; }
.seg select { padding: 7px 10px; font-size: 13px; margin-right: 8px; }
.posrow { margin-top: -8px; }
.posrow .fchip { padding: 6px 11px; font-size: 13.5px; }

/* ---------- player cards ---------- */
.grp { margin: 26px 0 10px; display: flex; align-items: baseline; gap: 12px; }
.grp:first-child { margin-top: 0; }
.grp h3 { margin: 0; font: 800 italic 24px/1 var(--display); text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; }
.grp span { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.grp::after { content: ''; flex: 1; height: 2px; background: linear-gradient(90deg, var(--line2), transparent); transform: translateY(-5px); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 10px; }
.pcard { position: relative; display: flex; align-items: center; gap: 14px; width: 100%; padding: 13px 16px; border: 0; text-align: left; cursor: pointer; color: inherit;
  background: linear-gradient(100deg, rgba(255, 255, 255, .075), rgba(255, 255, 255, .02) 60%), var(--panel);
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%); transition: transform .18s var(--ease), background .18s; }
.pcard::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--tier); transition: width .18s var(--ease); }
.pcard:hover { transform: translateY(-2px); background: linear-gradient(100deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, .04) 60%), var(--panel-hi); }
.pcard:hover::before { width: 6px; }
.pcard:active { transform: scale(.985); }
.pc-main { flex: 1; min-width: 0; }
.pc-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font: 700 23px/1.05 var(--display); text-transform: uppercase; }
.pc-name.n2 { font-size: 20.5px; } .pc-name.n3 { font-size: 18.5px; } .pc-name.n4 { font-size: 16.5px; }
.pc-name .fn { font-weight: 500; color: rgba(255, 255, 255, .62); }
.pc-meta { margin-top: 3px; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pc-meta b { color: #fff; font-weight: 700; }
.pc-tags { display: flex; align-items: center; gap: 8px; margin-top: 7px; flex-wrap: wrap; }
.pc-k { text-align: right; flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.pc-k b { display: block; font: 700 21px/1 var(--display); white-space: nowrap; }
.pc-k span { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.pc-k .exp { color: var(--warn); }
.pc-k .btn { margin-top: 6px; }
.rank { flex: none; width: 34px; font: 800 italic 24px/1 var(--display); color: var(--dim); text-align: center; }

/* dense tables (cap, standings, leaders, lists) */
.tablewrap { overflow-x: auto; }
table.dense { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
table.dense th { padding: 8px 10px; text-align: left; font: 600 11px Inter, sans-serif; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); border-bottom: 1px solid var(--line2); white-space: nowrap; }
table.dense td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.dense .r { text-align: right; }
table.dense tr.me td { background: color-mix(in srgb, var(--tc2) 14%, transparent); }
table.dense tr.total td { font-weight: 700; border-top: 1px solid var(--line2); }
table.dense tr.void td { color: var(--dim); }
table.dense tr.click { cursor: pointer; }
table.dense tr.click:hover td { background: rgba(255, 255, 255, .05); }
table.dense .shield { --s: 30px; }
.pn { font: 700 16px/1.1 var(--display); text-transform: uppercase; white-space: nowrap; }

/* ---------- player sheet / modals ---------- */
.overlay { position: fixed; inset: 0; z-index: 40; overflow-y: auto; background: rgba(2, 4, 8, .74); backdrop-filter: blur(3px); padding: 48px 24px; }
.sheet { position: relative; margin: 0 auto; width: min(1040px, 100%); background: var(--solid); box-shadow: 0 30px 80px rgba(0, 0, 0, .6);
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 26px), calc(100% - 26px) 100%, 0 100%); }
.sheet.rise { animation: rise .34s var(--ease) both; }
.sheet.narrow { width: min(860px, 100%); }
@keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
.ps-hero { position: relative; display: flex; align-items: center; gap: 30px; padding: 34px 40px 30px; overflow: hidden; min-height: 210px; color: #fff;
  background:
    repeating-linear-gradient(-62deg, rgba(255, 255, 255, .045) 0 2px, transparent 2px 12px) 100% 0 / 44% 100% no-repeat,
    linear-gradient(112deg, var(--tc1) 0 60%, var(--tc2) 60% 63%, var(--tc1) 63% 66%, color-mix(in srgb, var(--tc2) 70%, #000) 66%); }
.ps-hero.slim { min-height: 0; padding: 26px 40px 22px; }
.ps-hero .ghost { position: absolute; right: 30px; bottom: -34px; max-width: 40%; overflow: hidden; white-space: nowrap; font: 800 italic 190px/1 var(--display); color: transparent; -webkit-text-stroke: 2px rgba(255, 255, 255, .12); text-transform: uppercase; pointer-events: none; }
.ps-id { position: relative; min-width: 0; padding-right: 40px; }
.ps-hero h2 { margin: 0; font: 800 italic 74px/.86 var(--display); text-transform: uppercase; text-shadow: 0 2px 18px rgba(0, 0, 0, .35); }
.ps-hero h2.n2 { font-size: 62px; } .ps-hero h2.n3 { font-size: 52px; } .ps-hero h2.n4 { font-size: 44px; }
.ps-hero h2 .fn { display: block; font-size: 34px; font-weight: 600; color: rgba(255, 255, 255, .8); }
.ps-hero.slim h2 { font-size: 44px; }
.ps-meta { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 14px; font: 600 15px var(--display); text-transform: uppercase; letter-spacing: .12em; color: rgba(255, 255, 255, .85); }
.ps-meta b { color: #fff; }
.x { position: absolute; z-index: 2; right: 18px; top: 16px; width: 42px; height: 42px; border: 0; cursor: pointer; background: rgba(0, 0, 0, .4); color: #fff; font-size: 18px; clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
.x:hover { background: rgba(0, 0, 0, .65); }
.ps-body { padding: 26px 40px 30px; }
.ps-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.ps-row.r3 { grid-template-columns: repeat(3, 1fr); }
.stat { padding: 14px 16px; background: rgba(255, 255, 255, .045); clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%); min-width: 0; }
.stat > span { display: block; font: 600 11px Inter, sans-serif; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; }
.stat > b { font: 800 34px/1 var(--display); white-space: nowrap; }
.stat > b small { font: 600 15px var(--display); color: var(--muted); margin-left: 6px; }
.attr { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px 10px; }
.attr span { font: 600 11px Inter, sans-serif; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.attr b { font: 800 30px/1 var(--display); }
.attr .bar { grid-column: span 2; height: 7px; background: rgba(255, 255, 255, .07); transform: skewX(-18deg); }
.attr .bar i { display: block; height: 100%; background: var(--tier); }
.sec { margin: 28px 0 12px; font: 800 italic 22px/1 var(--display); text-transform: uppercase; letter-spacing: .04em; display: flex; align-items: center; gap: 12px; }
.sec::after { content: ''; flex: 1; height: 2px; background: linear-gradient(90deg, var(--line2), transparent); }
.sec small { font: 500 12px Inter, sans-serif; text-transform: none; letter-spacing: 0; color: var(--muted); }
.seasons td:first-child { font: 700 16px var(--display); letter-spacing: .06em; white-space: nowrap; }
.opt { position: relative; margin-top: 22px; padding: 20px 24px; background: linear-gradient(100deg, color-mix(in srgb, var(--tc2d) 34%, var(--solid)), var(--solid) 70%); border-left: 4px solid var(--tc2b);
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%); }
.opt h4 { margin: 0 0 6px; font: 800 italic 24px/1 var(--display); text-transform: uppercase; }
.opt p { margin: 0 0 14px; font-size: 14px; color: rgba(255, 255, 255, .86); }
.rels { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rels .stat > b { font-size: 26px; }
.ps-actions { position: sticky; bottom: 0; z-index: 3; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 16px 40px 22px; background: linear-gradient(0deg, var(--solid) 72%, rgba(10, 17, 30, 0)); }
.warnbox { margin: 14px 0; padding: 11px 14px; border-left: 4px solid var(--warn); background: rgba(255, 181, 71, .1); color: #ffe0b0; font-size: 14px; }
.badbox { margin: 14px 0; padding: 11px 14px; border-left: 4px solid var(--bad); background: rgba(255, 90, 106, .12); color: #ffd0d5; font-size: 14px; }

/* offer */
.offergrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.offergrid label { display: flex; flex-direction: column; gap: 6px; font: 600 11px Inter, sans-serif; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.offergrid input { font: 700 24px/1 var(--display); padding: 10px 12px; }
.mood { display: flex; align-items: center; gap: 16px; margin: 18px 0 8px; }
.mood .verdict { font-size: 26px; margin: 0; white-space: nowrap; }
.mood .bar { flex: 1; height: 10px; background: rgba(255, 255, 255, .07); transform: skewX(-18deg); }
.mood .bar i { display: block; height: 100%; }
.notes { display: flex; flex-wrap: wrap; gap: 6px; }
.notes span { padding: 3px 10px; font-size: 12px; background: rgba(255, 255, 255, .06); color: var(--muted); }
.notes span.g { color: #8ff0c4; } .notes span.b { color: #ffadb5; }

/* ---------- league ---------- */
.subtabs { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
.divs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.divs .panel { padding: 16px 16px 18px; }
.divs h3, .panel h3.ph3 { margin: 0 0 10px; font: 800 italic 22px/1 var(--display); text-transform: uppercase; }
.sched { display: grid; gap: 6px; }
.wk { display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 14px; padding: 10px 16px; background: var(--panel); clip-path: polygon(0 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%); }
.wk.cur { background: color-mix(in srgb, var(--tc2d) 30%, var(--solid)); }
.wk .n { font: 800 italic 22px/1 var(--display); color: var(--dim); }
.wk.cur .n { color: #fff; }
.wk .opp { font: 700 19px/1.1 var(--display); text-transform: uppercase; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wk .opp small { font: 500 12px Inter, sans-serif; text-transform: none; color: var(--muted); margin-left: 8px; }
.res { font: 800 20px var(--display); white-space: nowrap; }
.res i { font-style: normal; display: inline-block; width: 26px; text-align: center; margin-right: 8px; transform: skewX(-12deg); color: #0a0f18; }
.res i.w { background: var(--good); } .res i.l { background: var(--bad); } .res i.t { background: var(--warn); }
.scores { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.score { padding: 10px 14px; background: var(--panel); font-size: 14px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
.score b { font: 800 18px var(--display); }
.score .l { color: var(--muted); }

/* depth chart */
.depthgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.depthgrid .panel { padding: 16px 16px 14px; }
.depthgrid h3 { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 8px; font: 800 italic 24px/1 var(--display); text-transform: uppercase; }
.depthgrid h3 small { font: 500 12px Inter, sans-serif; text-transform: none; color: var(--muted); }
.drow { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); }
.drow:first-of-type { border-top: 0; }
.drow .no { width: 44px; flex: none; text-align: center; }
.drow .no.bk { font: 800 15px var(--display); color: var(--dim); }
.drow .nm { flex: 1; min-width: 0; font: 700 17px/1.1 var(--display); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: none; border: 0; text-align: left; cursor: pointer; padding: 0; color: inherit; }
.drow .nm:hover { text-decoration: underline; }
.drow:not(.starter) .nm { color: var(--muted); font-weight: 600; }
.mv { width: 32px; height: 30px; flex: none; border: 0; cursor: pointer; background: rgba(255, 255, 255, .07); color: var(--muted); font-size: 12px; transition: background .12s, color .12s; }
.mv:hover { background: rgba(255, 255, 255, .16); color: #fff; }
.mv:disabled { opacity: .25; pointer-events: none; }

/* draft */
.clock { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; margin-bottom: 18px; }
.clock .hero { grid-column: auto; min-height: 230px; }
.clock .hero h3, .clock .hero p { max-width: 62%; }

/* trade */
.partner { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.pick-team { position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 20px 10px 16px; color: #fff; background: var(--ptc1);
  clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); flex: none; max-width: 100%; min-width: 0; }
.pick-team b { font: 800 italic 24px/1 var(--display); text-transform: uppercase; }
.pick-team span { font-size: 12.5px; opacity: .92; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pick-team .car { font-size: 13px; opacity: .8; flex: none; }
.pick-team select { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.pick-team:hover { filter: brightness(1.15); }
.teamstrip { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.teamstrip::-webkit-scrollbar { display: none; }
.teamstrip button { flex: none; width: 46px; padding: 8px 0; border: 0; cursor: pointer; background: rgba(255, 255, 255, .06); font: 700 14px var(--display); letter-spacing: .04em; color: var(--muted); border-bottom: 3px solid var(--c); transition: background .15s, color .15s; }
.teamstrip button:hover { background: rgba(255, 255, 255, .14); color: #fff; }
.teamstrip button.on { background: var(--c); color: #fff; }
.trade { display: grid; grid-template-columns: 1fr 300px 1fr; gap: 14px; align-items: start; }
.tside { padding: 0 0 18px; }
.tside-h { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 20px; overflow: hidden; color: #fff;
  background: repeating-linear-gradient(-62deg, rgba(255, 255, 255, .05) 0 2px, transparent 2px 11px), linear-gradient(112deg, var(--s1) 0 46%, var(--s2) 46% 48%, var(--s1) 48%); }
.tside-h h3 { margin: 0; font: 800 italic 26px/1 var(--display); text-transform: uppercase; white-space: nowrap; text-shadow: 0 1px 8px rgba(0, 0, 0, .4); }
.tside-h span { position: relative; padding: 3px 8px; background: rgba(0, 0, 0, .45); font-size: 12.5px; white-space: nowrap; }
.tside .in { padding: 14px 18px 0; }
.lbl { margin: 16px 0 8px; font: 600 11px Inter, sans-serif; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); }
.lbl:first-child { margin-top: 0; }
.tcard { display: flex; align-items: center; gap: 12px; padding: 10px 12px; margin-bottom: 8px; background: rgba(255, 255, 255, .07); clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%); }
.tcard .pc-name { font-size: 21px; }
.tcard .pc-name.n3, .tcard .pc-name.n4 { font-size: 17px; }
.rm { flex: none; width: 30px; height: 30px; border: 0; cursor: pointer; background: rgba(255, 255, 255, .08); color: var(--muted); }
.rm:hover { background: rgba(255, 90, 106, .25); color: #fff; }
.empty { padding: 14px; border: 1px dashed var(--line2); color: var(--dim); font-size: 13px; text-align: center; margin-bottom: 8px; }
.ptok { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px 8px 14px; margin: 0 6px 6px 0; border: 0; cursor: pointer; color: #fff; background: color-mix(in srgb, var(--tc2) 26%, rgba(255, 255, 255, .04)); border-left: 3px solid var(--tc2b);
  font: 700 17px/1 var(--display); letter-spacing: .05em; }
.ptok small { font: 500 11.5px Inter, sans-serif; color: var(--muted); letter-spacing: 0; }
.ptok:hover small { color: #fff; }
select.ptok.add { background: none; border: 1px dashed var(--line2); color: var(--muted); padding: 7px 10px; font: 700 16px/1 var(--display); -webkit-appearance: none; appearance: none; }
select.ptok.add:hover { color: #fff; border-color: #fff; }
.picker { max-height: 318px; overflow-y: auto; margin: 0 -6px; padding: 0 6px; scrollbar-width: thin; }
.prow { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 8px; border: 0; background: none; cursor: pointer; text-align: left; color: inherit; transition: background .12s; }
.prow:hover { background: rgba(255, 255, 255, .07); }
.prow .nm { flex: 1; min-width: 0; font: 700 17px/1.05 var(--display); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow .nm small { font: 500 12px Inter, sans-serif; text-transform: none; color: var(--muted); margin-left: 6px; }
.prow .hit { font: 600 15px var(--display); color: var(--muted); white-space: nowrap; }
.prow .add { width: 26px; height: 26px; flex: none; display: grid; place-items: center; background: rgba(255, 255, 255, .08); font-weight: 700; }
.prow.on { background: rgba(255, 255, 255, .1); }
.prow.on .add { background: #fff; color: #0a0f18; }
.meter { position: sticky; top: 18px; padding: 22px; text-align: center; }
.gauge { width: 100%; max-width: 240px; display: block; margin: 0 auto; }
.verdict { margin: 4px 0; font: 800 italic 28px/1 var(--display); text-transform: uppercase; }
.verdict.g { color: var(--good); } .verdict.w { color: var(--warn); } .verdict.b { color: var(--bad); }
.meter .why { font-size: 12.5px; color: var(--muted); margin: 0 0 14px; }
.caps { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0 16px; text-align: left; }
.caps .stat > b { font-size: 24px; }
.meter .btns { flex-direction: column; }
.meter .btn { justify-content: center; }
.meter .rules { margin: 12px 0 0; font-size: 11.5px; color: var(--dim); }
.meter .say { margin: 12px 0 0; font-size: 13.5px; text-align: left; }
.locked { padding: 40px 32px; text-align: center; }
.locked h3 { margin: 0 0 8px; font: 800 italic 30px/1 var(--display); text-transform: uppercase; }

/* bracket */
.bracket { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; align-items: center; }
.bcol { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.bcol h4 { margin: 0 0 2px; font: 700 13px var(--display); text-transform: uppercase; letter-spacing: .14em; color: var(--muted); text-align: center; }
.bgame { background: var(--panel); clip-path: polygon(0 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%); }
.bteam { display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 8px; padding: 7px 10px; border-top: 1px solid var(--line); font: 700 16px/1 var(--display); text-transform: uppercase; }
.bteam:first-child { border-top: 0; }
.bteam .sd { color: var(--dim); font-size: 13px; }
.bteam.lost { color: var(--dim); } .bteam.me { background: color-mix(in srgb, var(--tc2) 24%, transparent); }
.bgame.tbd .bteam { color: var(--dim); }
.sb .bgame { border-top: 3px solid #f2c14e; }
.champ { margin-bottom: 18px; }

/* start screen */
.startpage { min-height: 100vh; background-color: var(--bg0);
  background-image: repeating-linear-gradient(-62deg, rgba(255, 255, 255, .03) 0 1px, transparent 1px 15px), linear-gradient(118deg, transparent 0 63%, rgba(198, 12, 48, .28) 63% 64.6%, transparent 64.6% 67.4%, rgba(198, 12, 48, .16) 67.4% 68%, transparent 68%), linear-gradient(180deg, #0d1a2e, var(--bg0) 700px);
  background-repeat: no-repeat; }
.start { padding: 56px 32px 64px; max-width: 1240px; margin: 0 auto; }
.logo { font: 800 italic 96px/.85 var(--display); text-transform: uppercase; letter-spacing: -.005em; margin: 0; }
.logo span { display: block; font-size: 22px; font-weight: 700; letter-spacing: .34em; color: var(--muted); margin-bottom: 10px; font-style: normal; }
.start p.lead { max-width: 660px; color: var(--muted); margin: 18px 0 22px; }
.seedrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 18px 0 0; font-size: 13px; color: var(--muted); }
.seedrow input { width: 130px; }
.teamgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; margin-top: 14px; }
.teambtn { position: relative; display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 0; cursor: pointer; text-align: left; overflow: hidden; color: var(--on-tc1);
  background: repeating-linear-gradient(-62deg, rgba(255, 255, 255, .06) 0 2px, transparent 2px 11px) 100% 0 / 40% 100% no-repeat, linear-gradient(112deg, var(--tc1) 0 74%, var(--tc2) 74% 77%, var(--tc1) 77%);
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%); transition: transform .18s var(--ease), filter .18s; }
.teambtn:hover { transform: translateY(-2px); filter: brightness(1.12); }
.teambtn:active { transform: scale(.98); }
.teambtn b { font: 800 italic 30px/1 var(--display); min-width: 58px; }
.teambtn span { font: 700 17px/1.1 var(--display); text-transform: uppercase; letter-spacing: .04em; }
.h3 { margin: 40px 0 0; font: 800 italic 28px/1 var(--display); text-transform: uppercase; }

/* phone tab bar + "More" menu */
.tabbar { display: none; }
.tabbar button { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 7px; border: 0; background: none; color: rgba(255, 255, 255, .55); cursor: pointer;
  font: 700 12px/1 var(--display); text-transform: uppercase; letter-spacing: .06em; position: relative; white-space: nowrap; }
.tabbar svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  return r;
}

// AI cap compliance: restructure big contracts first, then cut the worst value-for-money players.
// keepYoungStars: never cut an 80+ player under 30 (used when making room in the late market)
function aiCapFix(abbr, buffer, keepYoungStars) {
  var guard = 0;
  while (space(abbr) < buffer && guard++ < 40) {
    var ros = roster(abbr);
    var rc = ros.filter(function (p) { return p.age <= 32 && p.ovr >= 70 && Cap.restructureMax(p, S.year, p.exp) > 3000; })
                .sort(byKey(function (p) { return Cap.restructureMax(p, S.year, p.exp); }, true))[0];
    if (rc) { restructurePlayer(rc, Cap.restructureMax(rc, S.year, rc.exp)); continue; }
    var cut = ros.map(function (p) { var pv = releasePreview(p, !isPostJune() && canJune1(abbr) && Cap.capHit(p, S.year) > 15000); return { p: p, pv: pv, s: pv.savings / 1000 - Math.max(0, p.ovr - 60) * 0.5 }; })
                 .filter(function (x) { return x.pv.savings > 500 && !(keepYoungStars && x.p.ovr >= 80 && x.p.age < 30); })
                 // keep good young players unless there's no other way to get compliant
                 .sort(byKey(function (x) { return x.s - (x.p.ovr >= 80 && x.p.age < 30 ? 1000 : 0); }, true))[0];
    if (!cut) break;
    release(cut.p, cut.pv.post && !isPostJune());
  }
}

// End of re-sign window: AI teams keep the expiring players they want; everyone else hits free agency.
function aiResign() {
  aiTeams().forEach(function (abbr) {
    aiCapFix(abbr, 25000);
    var mine = S.players.filter(function (p) { return !p.team && p.rights === abbr; }).sort(byKey(function (p) { return p.ovr; }, true));
    mine.forEach(function (p) {
      var want = p.ovr >= 62 && p.age <= 32 && (needAt(abbr, p.pos, p.ovr) > 0 || p.ovr >= 74);
      if (!want || RNG.next() > (p.ovr >= 75 ? 0.92 : 0.75)) return;
      var off = aiOffer(p, abbr, 1.0);
      if (space(abbr) - Cap.buildContract(off, S.year, p.exp)[0].cap > aiReserve(abbr)) sign(p, abbr, off, true);
    });
  });
  S.players.forEach(function (p) { if (!p.team) p.rights = null; });
}

// One day of free agency: AI teams sign the best fits they can afford.
// What an AI front office holds back: the cost to fill 53 (unsigned picks at slot + open spots at the
// minimum) plus a ~$9M cushion for week 1.
function aiReserve(abbr) { return rosterFill(abbr).need + 9000; }
function aiFreeAgencyDay() {
  var order = RNG.shuffle(aiTeams());
  var pool = freeAgents().sort(byKey(function (p) { return p.ovr; }, true));
  var rookieRoom = S.phase === 'fa' || S.phase === 'resign' ? 14000 : 3000;   // keep room for rookies
  for (var round = 0; round < 4; round++) {
    order.forEach(function (abbr) {
      if (roster(abbr).length >= rosterMax() - 2) return;
      var sp = S.phase === 'preseason' ? Math.min(space(abbr), fullSpace(abbr)) : space(abbr);   // preseason: week-1 counting
      // teams keep enough to fill the roster (draft picks + minimum-salary spots) plus a cushion
      var target = aiReserve(abbr) + (S.phase === 'fa' && S.faDay < 3 ? 4000 : 0);
      var disc = 1 - Market.faDiscount(S.faDay);
      if (sp <= target) return;
      var best = null, bestScore = 0;
      for (var i = 0; i < pool.length && i < 300; i++) {
        var p = pool[i];
        if (p.team) continue;
        var lift = needAt(abbr, p.pos, p.ovr) * Market.POS_WEIGHT[p.pos];
        var depth = sp > capOf(S.year) * 0.15 ? Math.max(0, p.ovr - 68) * 0.25 : 0;   // rich teams buy depth too
        if (lift + depth <= 0) continue;
        var cost = Market.demand(p, marketCap(), S.year).apy * disc;
        if (sp - cost > target - 2000) {
          var score = (lift + depth) / Math.pow(cost / 1000 + 1, 0.35) * (0.85 + RNG.next() * 0.3);
          if (score > bestScore) { best = p; bestScore = score; }
        }
      }
      if (best) {
        var mult = (0.95 + RNG.next() * 0.12) * disc;
        var off = aiOffer(best, abbr, mult);
        var ev = Market.evaluate(best, off, offerCtx(best, abbr));
        if (!ev.accept && ev.mood < 0.95) off = aiOffer(best, abbr, mult + 0.08);
        sign(best, abbr, off, true);
      }
    });
  }
}

// Late market (preseason): good players still unsigned take one-year "prove-it" deals for whatever room
// a team has, as long as it reaches about a third of their ask. Teams with the most room go first.
// room that will still be there at week 1, when every contract counts (not just the top 51)
function lateRoom(a) { return Math.min(space(a), fullSpace(a)) - 4500; }   // AI keeps a $4.5M in-season buffer
function aiLateMarket() {
  freeAgents().filter(function (p) { return p.ovr >= 78; }).sort(byKey(function (p) { return p.ovr - (p.age >= 30 ? 10 : 0); }, true)).forEach(function (p) {
    // a young player still unsigned this late takes a cheaper prove-it deal (25% of his ask; vets 35%)
    var ask = Market.demand(p, marketCap(), S.year).apy, floor = Math.max(Cap.minSalary(p.exp, S.year), Math.round(ask * (p.age < 30 ? 0.25 : 0.35)));   // same 25% as lateMarketFloor
    var full = function (a) { return roster(a).length >= rosterMax(); };
    var teams = aiTeams().filter(function (a) { return a !== S.user && (!full(a) || S.phase === 'season'); })
      .map(function (a) { return { a: a, room: lateRoom(a) }; }).filter(function (t) { return t.room >= floor; })
      .sort(byKey(function (t) { return t.room + (needAt(t.a, p.pos, p.ovr) > 0 ? 20000 : 0); }, true));
    if (!teams.length) {
      // nobody has the room: the team that needs him most makes room (restructures, then cuts lesser players)
      // nobody has the room: the neediest teams (up to five) try to make room (restructures, then cuts)
      var needy = aiTeams().filter(function (a) { return a !== S.user && (!full(a) || S.phase === 'season'); })
        .sort(byKey(function (a) { return needAt(a, p.pos, p.ovr) * 1000 + space(a) / 1000; }, true)).slice(0, 5);
      for (var ni = 0; ni < needy.length && !teams.length; ni++) {
        aiCapFix(needy[ni], floor + 4000 + Math.max(0, space(needy[ni]) - fullSpace(needy[ni])), true);
        if (lateRoom(needy[ni]) >= floor) teams = [{ a: needy[ni], room: lateRoom(needy[ni]) }];
      }
      if (!teams.length && p.age < 30) {
        // still nobody: a good young player takes whatever prove-it deal is on the table (12% of his ask)
        var low = Math.max(Cap.minSalary(p.exp, S.year), Math.round(ask * 0.12));
        teams = aiTeams().filter(function (a) { return a !== S.user && (!full(a) || S.phase === 'season'); })
          .map(function (a) { return { a: a, room: lateRoom(a) }; }).filter(function (t) { return t.room >= low; })
          .sort(byKey(function (t) { return t.room + (needAt(t.a, p.pos, p.ovr) > 0 ? 20000 : 0); }, true));
      }
      if (!teams.length) return;
    }
    var price = Math.min(ask, teams[0].room);
    if (full(teams[0].a)) cutdownOne(teams[0].a, p.pos);   // in season: release the weakest player elsewhere first
    sign(p, teams[0].a, { years: 1, total: price, bonus: 0, gtd: Math.round(price * 0.5) }, true);
  });
}

// Fill thin rosters with the best veterans they can afford late in the market (asks drop to ~70%),

// One source of truth for how open roster spots are filled and priced. Auto-fill uses it to sign players,
// and the room-needed figures use it to estimate, so warnings match what auto-fill actually does.
var FILLER_PRICE_EXP = 0;            // generated depth players are undrafted rookies at the rookie minimum
function fillNeedPos(counts) {
  return POSITIONS.map(function (pos) { return { pos: pos, short: depthTarget(pos) - (counts[pos] || 0) }; })
    .sort(byKey(function (n) { return n.short; }, true))[0].pos;
}
// Best free agent at `pos` affordable on `budget` (late-market asks drop to ~60%), else null (a generated
// depth player at the minimum). `taken` = ids already planned.
// frugal: only players who'd sign for their league minimum (or a generated depth player).
function fillChoice(pos, budget, taken, frugal) {
  var cands = freeAgents().filter(function (p) { return p.pos === pos && !(taken && taken[p.id]); }).sort(byKey(function (p) { return p.ovr; }, true));
  if (frugal) {   // cheapest player who signs for his minimum (undrafted rookies first), best rating among ties
    var best = null;
    cands.forEach(function (c) {
      var min = Cap.minSalary(c.exp, S.year), pr = Math.max(min, Math.round(Market.demand(c, marketCap(), S.year).apy * 0.6));
      if (pr <= min && (!best || pr < best.price)) best = { p: c, price: pr };
    });
    var fill = Cap.minSalary(FILLER_PRICE_EXP, S.year);
    return best && best.price <= fill ? best : { p: null, price: fill };   // never pay more than an undrafted rookie
  }
  for (var i = 0; i < cands.length; i++) {
    var c = cands[i], min = Cap.minSalary(c.exp, S.year);
    var pr = Math.max(min, Math.round(Market.demand(c, marketCap(), S.year).apy * 0.6));

// Plan `slots` signings for `abbr` starting from `room` of cap space, without signing anyone.
// extraPos: position of a player about to be added (counts toward depth needs).
// frugal: fill every spot the cheapest way (minimum-ish players only), i.e. the least it can cost.
function planFill(abbr, slots, room, extraPos, frugal) {
  var counts = {}, taken = {}, cost = 0;
  roster(abbr).forEach(function (p) { counts[p.pos] = (counts[p.pos] || 0) + 1; });
  if (extraPos) counts[extraPos] = (counts[extraPos] || 0) + 1;

    var pos = fillNeedPos(counts), ch = fillChoice(pos, fillBudget(room, n), taken, frugal);
    if (ch.p) taken[ch.p.id] = true;

function aiFillRoster(target, teams) {
  (teams || aiTeams()).forEach(function (abbr) {
    var need = (target - roster(abbr).length) * 1100;
    if (need > 0 && (abbr !== S.user || S.autopilot)) aiCapFix(abbr, need);
    var guard = 0, slots = target - roster(abbr).length;
    // if the normal plan doesn't fit the room, fill frugally (minimum-ish players) so as many spots as
    // possible get filled
    var userTeam = abbr === S.user && !S.autopilot;
    var cushion = userTeam ? 0 : 9000;                          // AI teams fill while keeping a week-1 cushion
    var avail = userTeam ? Math.min(space(abbr), fullSpace(abbr)) : Math.min(space(abbr), fullSpace(abbr)) - cushion;
    var frugal = slots > 0 && planFill(abbr, slots, avail) > avail;
    while (roster(abbr).length < target && guard++ < 80) {
      var counts = {};
      roster(abbr).forEach(function (p) { counts[p.pos] = (counts[p.pos] || 0) + 1; });
      var pos = fillNeedPos(counts);
      var ch = fillChoice(pos, fillBudget(Math.min(space(abbr), fullSpace(abbr)) - cushion, target - roster(abbr).length), null, frugal);
      var p = ch.p, price = ch.price;
      var fillPrice = Cap.minSalary(FILLER_PRICE_EXP, S.year);

      // if the first choice doesn't fit, fall back to an undrafted rookie at the minimum
      var userRoom = abbr === S.user && !S.autopilot ? fullSpace(abbr) : Infinity;
      if (p && price > userRoom) p = null;
      if (!p) { if (fillPrice > userRoom) break; p = makeFiller(pos); price = fillPrice; }
      var r = sign(p, abbr, { years: 1, total: price, bonus: 0, gtd: 0 }, true);

// AI teams with lots of room pre-pay future salary so unused space doesn't pile up via rollover.
function aiPrepay(keep) {

    roster(abbr).filter(function (p) { return Cap.yearsLeft(p, S.year) >= 2; })
      .sort(byKey(function (p) { return Cap.capHit(p, S.year + 1); }, true))
      .forEach(function (p) { if (excess > 0) excess -= Cap.prepay(p, S.year, excess, p.exp); });
  });
}

// AI extends good players entering the last year of their deal (keeps cores together, uses cap).
function aiExtensions() {
  aiTeams().forEach(function (abbr) {
    var rich = space(abbr) > capOf(S.year) * 0.08;
    roster(abbr).filter(function (p) { return Cap.yearsLeft(p, S.year) <= (rich ? 2 : 1) && p.ovr >= (rich ? 70 : 75) && p.age <= 30; }).forEach(function (p) {
      if (!rich && RNG.next() < 0.5) return;
      var off = aiOffer(p, abbr, 1.02);
      var yrs = buildExtensionYears(p, off);
      var delta = Cap.capHit(p, S.year) - (Cap.row({ years: yrs }, S.year) || { cap: 0 }).cap;
      if (space(abbr) + delta > 10000 && Market.evaluate(p, off, offerCtx(p, abbr)).accept) extend(p, off);
    });
  });
}

var DEPTH_TARGET = { QB: 3, RB: 4, WR: 6, TE: 3, OT: 4, IOL: 5, EDGE: 5, DL: 5, LB: 5, CB: 6, S: 4, K: 1, P: 1, LS: 1 };
function depthTarget(pos) { return DEPTH_TARGET[pos]; }

// Cut down to 53: drop the least useful players, avoiding big dead money.
function cutdown(abbr) {
  var guard = 0;
  while (roster(abbr).length > ROSTER_MAX && guard++ < 100) {
    var ros = roster(abbr);
    var scored = ros.map(function (p) {
      var cnt = ros.filter(function (q) { return q.pos === p.pos && q.ovr > p.ovr; }).length;
      var surplus = cnt - depthTarget(p.pos) + 1;
      var pv = releasePreview(p, false);
      return { p: p, s: p.ovr - Math.max(0, surplus) * 6 + pv.now / 1000 * 1.5 + (p.age <= 23 ? 4 : 0), ok: space(abbr) + pv.savings >= 0 };
    }).filter(function (x) { return x.ok; }).sort(byKey(function (x) { return x.s; }));
    if (!scored.length) break;
    release(scored[0].p, false);
  }
}

            exp: 0, draft: [0, 0, 0], apy: 0, signed: S.year, gtdTotal: 0, years: [], options: [], status: 'FA',

// The user's "auto roster" button: fill thin spots with minimum-salary players, then cut to 53.
// Returns { filled, missing, short, msg }. Says so when the cap stops it short of 53.
function userAutoRoster() {

  autoDepth(S.user);

  return { filled: n - before, missing: missing, short: short,

}

// ---------- room needed to fill 53 ----------
function pickNumberEstimate(k) {
  if (k.no) return k.no;
  var ord = S.lastOrder || BASE.draftOrder, i = ord ? ord.indexOf(k.orig) : -1;
  return (k.round - 1) * 32 + (i >= 0 ? i + 1 : 16);
}
function unsignedPicks(abbr) {
  if (!(S.phase === 'resign' || S.phase === 'fa' || S.phase === 'draft')) return [];
  return S.picks.filter(function (k) {
    return k.owner === abbr && k.year === S.year && !(S.draft && S.draft.order.indexOf(k.id) >= 0 && S.draft.order.indexOf(k.id) < S.draft.i);
  }).sort(byKey(pickNumberEstimate));
}
// What it costs to have 53 players at week 1 (when every contract counts): unsigned draft picks at their

  });
  var open = spots - picks.length;

  var preDraft = S.phase === 'resign' || S.phase === 'fa' || S.phase === 'draft';

// Best ways to make room: biggest restructure savings, and cuts that free the most for the least talent.
function makeRoomOptions(abbr) {
  var ros = roster(abbr);
  var rs = ros.map(function (p) { var m = Cap.restructureMax(p, S.year, p.exp), n = Math.min(5, Cap.remaining(p, S.year).length); return { p: p, saves: m - Math.floor(m / Math.max(1, n)) }; })
    .filter(function (x) { return x.saves > 500; }).sort(byKey(function (x) { return x.saves; }, true)).slice(0, 3);

      var pv = releasePreview(p, false), starter = starters(abbr, p.pos).indexOf(p) >= 0;
      return { p: p, saves: pv.savings, replacement: repl, net: pv.savings - repl, dead: pv.now, starter: starter };
    })
    .filter(function (x) { return x.net >= 250; })
    .sort(function (a, b) { return (a.starter - b.starter) || (b.net - a.net); }).slice(0, 5);

// Schedule, game sim from team strength, injuries, stats, standings, playoffs.
var WEEKS = 17;

function makeSchedule() {
  // 17 rounds, each a perfect matching of all 32 teams: 6 division rounds + 11 non-division rounds.
  var abbrs = TEAMS.map(function (t) { return t.abbr; });
  var divs = {};
  TEAMS.forEach(function (t) { (divs[t.conf + t.div] = divs[t.conf + t.div] || []).push(t.abbr); });
  var rounds = [];
  var rr = [[[0, 1], [2, 3]], [[0, 2], [1, 3]], [[0, 3], [1, 2]]];
  for (var leg = 0; leg < 2; leg++) rr.forEach(function (pairs) {
    var games = [];
    Object.keys(divs).forEach(function (d) {
      pairs.forEach(function (pr) {
        var a = divs[d][pr[0]], b = divs[d][pr[1]];
        games.push(leg ? { h: b, a: a } : { h: a, a: b });
      });
    });
    rounds.push(games);
  });
  var met = {};
  function key(a, b) { return a < b ? a + b : b + a; }
  function sameDiv(a, b) { return TEAM[a].conf === TEAM[b].conf && TEAM[a].div === TEAM[b].div; }
  var homeCount = {};
  abbrs.forEach(function (a) { homeCount[a] = 3; });
  for (var r = 0; r < 11; r++) {
    for (var attempt = 0; attempt < 400; attempt++) {
      var left = RNG.shuffle(abbrs.slice()), games = [], okRound = true;
      while (left.length) {
        var a = left.shift();
        var idx = -1;
        for (var j = 0; j < left.length; j++) if (!sameDiv(a, left[j]) && !met[key(a, left[j])]) { idx = j; break; }
        if (idx < 0) { okRound = false; break; }
        var b = left.splice(idx, 1)[0];
        var home = homeCount[a] <= homeCount[b] ? a : b, away = home === a ? b : a;
        games.push({ h: home, a: away });
      }
      if (okRound) {
        games.forEach(function (g) { met[key(g.h, g.a)] = 1; homeCount[g.h]++; });
        rounds.push(games);

function simGame(home, away, neutral) {

// ---------- standings ----------
function pct(r) { var g = r.w + r.l + r.t; return g ? (r.w + r.t / 2) / g : 0; }

// Phase machine, draft, progression, retirements, contract rollover.

function canAdvance() {
  if (S.phase === 'preseason' && roster(S.user).length > ROSTER_MAX) return 'Cut your roster to ' + ROSTER_MAX + ' first (you have ' + roster(S.user).length + '), or use auto cut.';
  if (S.phase === 'preseason' && roster(S.user).length < 46) return 'You need at least 46 players to start the season (you have ' + roster(S.user).length + '). Sign free agents.';
  if (S.phase === 'draft' && S.draft && S.draft.i < S.draft.order.length) return 'Finish the draft first.';
  if (S.phase === 'draft' && !S.autopilot && pendingOptions(S.user).length) return 'Decide on the fifth-year option for ' + pendingOptions(S.user).map(function (p) { return p.name; }).join(', ') + ' (deadline: early May).';
  if (S.phase === 'preseason' && fullSpace(S.user) < 0) return 'From week 1 every contract counts, not just the top 51: you\'d be ' + fmtM(-fullSpace(S.user)) + ' over the cap.';
  if (S.phase === 'fa' && space(S.user) < 0) return 'You are over the cap. Clear space before moving on.';

function advance() {

    case 'draft':

      break;

      aiLateMarket();                          // second pass: cutdowns free room for anyone still unsigned
      aiTeams().forEach(function (a) { cutdown(a); });
      S.phase = 'season';                      // top-51 rule ends: every contract counts now
      aiTeams().forEach(function (a) { aiCapFix(a, 500); });
      aiLateMarket();                          // last pass: anyone a week-1 cap clean-up let go

}

function aiInSeason() {

    POSITIONS.forEach(function (pos) {

        var fa = freeAgents().filter(function (p) { return p.pos === pos; }).sort(byKey(function (p) { return p.ovr; }, true))[0];
        if (fa && roster(abbr).length >= ROSTER_MAX) cutdownOne(abbr, pos);

// ---------- draft ----------

  if (!S) return;

    var idx = S._idx; delete S._idx; S.rng = RNG.s;
    var json = JSON.stringify({ S: S, BASE: BASE });
    S._idx = idx;
    localStorage.setItem(SAVE_KEY, window.LZString ? 'lz:' + LZString.compressToUTF16(json) : json);
  } catch (e) { console.warn('save failed', e); flash('Could not save: browser storage is full or blocked.', true); }
}
function loadGame() {
  try {
    var raw = localStorage.getItem(SAVE_KEY); if (!raw) return false;
    var json = raw.slice(0, 3) === 'lz:' ? LZString.decompressFromUTF16(raw.slice(3)) : raw;
    var o = JSON.parse(json);
    S = o.S; BASE = o.BASE; reindex(); Market.setCurve(BASE.curve); Market.setScale(S.payScale || 1); Market.setDriftScale(S.driftScale || Market.calibrateDrift(S.players)); RNG.s = S.rng || S.seed;
    UI.view = 'hub'; UI._preview = null;
    return true;
  } catch (e) { console.warn('load failed', e); return false; }
}

// Boot: load data, restore save, wire events.
var DATA = null;
(function boot() {
  document.addEventListener('click', onClick);
  document.addEventListener('change', onChange);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && (UI.modal || UI.sheet)) { UI.modal = null; UI.offer = null; UI.sheet = null; render(); return; }
    onKey(e);
  });
  fetch('data.json').then(function (r) { return r.json(); }).then(function (d) {
    DATA = d; window.DATA = d; BASE = d.meta;
    render();
  }).catch(function () {
    document.getElementById('app').innerHTML = '<div class="startpage"><div class="start"><h1 class="logo">Gridiron GM</h1><p class="bad">Could not load player data. Reload the page to try again.</p></div></div>';
  });
})();

</script>
