<div id="app"><div class="start"><h1>NFL GM</h1><p class="muted">Loading rosters and contracts…</p></div></div>
<script>
// Helpers, team definitions, seeded RNG.
var TEAMS = [
  ['ARI', 'Arizona Cardinals', 'NFC', 'West', '#97233F'], ['ATL', 'Atlanta Falcons', 'NFC', 'South', '#A71930'],
  ['BAL', 'Baltimore Ravens', 'AFC', 'North', '#241773'], ['BUF', 'Buffalo Bills', 'AFC', 'East', '#00338D'],
  ['CAR', 'Carolina Panthers', 'NFC', 'South', '#0085CA'], ['CHI', 'Chicago Bears', 'NFC', 'North', '#0B162A'],
  ['CIN', 'Cincinnati Bengals', 'AFC', 'North', '#FB4F14'], ['CLE', 'Cleveland Browns', 'AFC', 'North', '#FF3C00'],
  ['DAL', 'Dallas Cowboys', 'NFC', 'East', '#003594'], ['DEN', 'Denver Broncos', 'AFC', 'West', '#FB4F14'],
  ['DET', 'Detroit Lions', 'NFC', 'North', '#0076B6'], ['GB', 'Green Bay Packers', 'NFC', 'North', '#203731'],
  ['HOU', 'Houston Texans', 'AFC', 'South', '#03202F'], ['IND', 'Indianapolis Colts', 'AFC', 'South', '#002C5F'],
  ['JAX', 'Jacksonville Jaguars', 'AFC', 'South', '#006778'], ['KC', 'Kansas City Chiefs', 'AFC', 'West', '#E31837'],
  ['LV', 'Las Vegas Raiders', 'AFC', 'West', '#A5ACAF'], ['LAC', 'Los Angeles Chargers', 'AFC', 'West', '#0080C6'],
  ['LA', 'Los Angeles Rams', 'NFC', 'West', '#003594'], ['MIA', 'Miami Dolphins', 'AFC', 'East', '#008E97'],
  ['MIN', 'Minnesota Vikings', 'NFC', 'North', '#4F2683'], ['NE', 'New England Patriots', 'AFC', 'East', '#002244'],
  ['NO', 'New Orleans Saints', 'NFC', 'South', '#D3BC8D'], ['NYG', 'New York Giants', 'NFC', 'East', '#0B2265'],
  ['NYJ', 'New York Jets', 'AFC', 'East', '#125740'], ['PHI', 'Philadelphia Eagles', 'NFC', 'East', '#004C54'],
  ['PIT', 'Pittsburgh Steelers', 'AFC', 'North', '#FFB612'], ['SF', 'San Francisco 49ers', 'NFC', 'West', '#AA0000'],
  ['SEA', 'Seattle Seahawks', 'NFC', 'West', '#69BE28'], ['TB', 'Tampa Bay Buccaneers', 'NFC', 'South', '#D50A0A'],
  ['TEN', 'Tennessee Titans', 'AFC', 'South', '#4B92DB'], ['WAS', 'Washington Commanders', 'NFC', 'East', '#5A1414'],
].map(function (t) { return { abbr: t[0], name: t[1], conf: t[2], div: t[3], color: t[4] }; });
var TEAM = {}; TEAMS.forEach(function (t) { TEAM[t.abbr] = t; });

var POSITIONS = ['QB', 'RB', 'WR', 'TE', 'OT', 'IOL', 'EDGE', 'DL', 'LB', 'CB', 'S', 'K', 'P', 'LS'];
var POS_LABEL = { OT: 'OT', IOL: 'IOL', EDGE: 'EDGE', DL: 'DL' };

// Seeded RNG (mulberry32); state lives in the save so sims are reproducible.
var RNG = {
  s: 1,
  next: function () {
    var t = (RNG.s = (RNG.s + 0x6D2B79F5) | 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  },
  int: function (a, b) { return a + Math.floor(RNG.next() * (b - a + 1)); },
  pick: function (arr) { return arr[Math.floor(RNG.next() * arr.length)]; },
  normal: function () { var u = 1 - RNG.next(), v = RNG.next(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); },
  shuffle: function (a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(RNG.next() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; },
};

function fmtM(k, dp) {
  if (k == null) return '–';
  if (Math.round(k) === 0) return '$0';
  var neg = k < 0; k = Math.abs(k);
  var s = k >= 1000 ? '$' + (k / 1000).toFixed(dp == null ? 1 : dp) + 'M' : '$' + Math.round(k) + 'K';
  return neg ? '−' + s : s;
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function sumBy(arr, f) { var s = 0; for (var i = 0; i < arr.length; i++) s += f(arr[i]); return s; }
function byKey(f, desc) { return function (a, b) { var x = f(a), y = f(b); return desc ? (y > x ? 1 : y < x ? -1 : 0) : (x > y ? 1 : x < y ? -1 : 0); }; }
function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
function chip(abbr) { var t = TEAM[abbr]; return t ? '<span class="chip" style="background:' + t.color + '"></span>' : ''; }

// Cap and contract rules. Pure functions, no DOM. Money is integer $ thousands ($K).
//
// A contract is player.years = [{y, base, pro, opt, roster, other, gtd, cap, void?}, ...] with consecutive y.
//   base    base salary            pro    prorated bonus charged this year (signing + exercised options)
//   opt     proration of option bonuses not yet exercised (counts on the cap, not dead money until exercised)
//   roster  roster bonus           other  workout/per-game/other bonuses
//   gtd     guaranteed cash still owed for that year (base/roster/other, plus a guaranteed option bonus)
//   cap     cap number = base + pro + opt + roster + other
//   void    void year: no salary, carries leftover proration that accelerates when the deal voids
// player.options = [{y, per, span}] pending option bonuses: exercised at the start of league year y.
// Team dead money lives in team.dead = {year: $K}.
// Team dead money lives in team.dead = {year: $K}.
var Cap = (function () {
  'use strict';

  var MAX_PRORATION_YEARS = 5;
  var CAP_GROWTH = 0.07;            // projected growth for years after the data's projection
  var MIN_ROSTER_FOR_SEASON = 53;

  // League minimum salary in 2027 by accrued seasons (2020 CBA schedule: 0, 1, 2, 3, 4-6, 7+);
  // the CBA raises each step $45K a year.
  var MIN_2027 = [930, 1050, 1120, 1190, 1260, 1260, 1260, 1345];
  function minSalary(exp, year) {
    var i = Math.max(0, Math.min(MIN_2027.length - 1, exp | 0));
    return MIN_2027[i] + 45 * Math.max(0, year - 2027);
  }

  function row(p, year) {
    if (!p.years) return null;
    for (var i = 0; i < p.years.length; i++) if (p.years[i].y === year) return p.years[i];
    return null;
  }
  function capHit(p, year) { var r = row(p, year); return r ? r.cap : 0; }
  function yearsLeft(p, year) { return (p.years || []).filter(function (r) { return r.y >= year && !r.void; }).length; }
  function opt(r) { return r.opt || 0; }
  function recalc(r) { r.cap = r.base + r.pro + opt(r) + r.roster + r.other; return r; }
  function remaining(p, year) { return (p.years || []).filter(function (r) { return r.y >= year; }); }
  function sum(arr, f) { var s = 0; for (var i = 0; i < arr.length; i++) s += f(arr[i]); return s; }
  function gtdLeft(p, year) { return sum(remaining(p, year), function (r) { return r.gtd; }); }
  function contractValueLeft(p, year) { return sum(remaining(p, year), function (r) { return r.base + r.roster + r.other; }); }

  // Exercise pending option bonuses due in `year` (teams exercise them when the league year's games start).
  // The option's proration becomes real (dead-money) proration, and a guaranteed option bonus leaves gtd.
  function exerciseOptions(p, year) {
    if (!p.options || !p.options.length) return 0;
    var done = 0;
    p.options = p.options.filter(function (op) {
      if (op.y !== year) return true;
      for (var y = op.y; y < op.y + op.span; y++) {
        var r = row(p, y);
        if (r) { var m = Math.min(op.per, opt(r)); r.opt = opt(r) - m; r.pro += m; }
      }
      var r0 = row(p, year);
      if (r0) {
        var cashGtd = r0.base + r0.roster;
        r0.gtd = Math.max(0, r0.gtd - Math.min(op.per * op.span, Math.max(0, r0.gtd - cashGtd)));
      }
      done++;
      return false;
    });
    return done;
  }
  // Contract has run out of real years: leftover void-year proration accelerates as dead money.
  function voidAcceleration(p, year) {
    var rows = remaining(p, year);
    if (!rows.length || !rows.every(function (r) { return r.void; })) return 0;
    return sum(rows, function (r) { return r.pro; });
  }

  // ---- Release ----
  // Pre-June 1: every remaining prorated bonus dollar and all remaining guaranteed salary hit this year.
  // Post-June 1 (or June 1 designation): this year's proration plus all remaining guaranteed salary hit
  // now; the later years' proration moves to next year's cap. (Same convention as OverTheCap.)
  function releaseCost(p, year, postJune1) {
    var rem = remaining(p, year);
    if (!rem.length) return { dead: {}, savings: 0, capHit: 0 };
    var cur = rem[0], later = rem.slice(1);
    var hit = cur.cap;
    var dead = {};
    var allGtd = sum(rem, function (r) { return r.gtd; });
    if (!postJune1) {
      dead[year] = sum(rem, function (r) { return r.pro; }) + allGtd;
    } else {
      dead[year] = cur.pro + allGtd;
      var nxt = sum(later, function (r) { return r.pro; });
      if (nxt) dead[year + 1] = nxt;
    }
    return { dead: dead, savings: hit - dead[year], capHit: hit, totalDead: sum(Object.keys(dead), function (k) { return dead[k]; }) };
  }

  function applyDead(team, dead) {
    team.dead = team.dead || {};
    Object.keys(dead).forEach(function (y) { if (dead[y]) team.dead[y] = (team.dead[y] || 0) + dead[y]; });
  }

  // ---- Trade ----
  // The old team keeps all unamortised signing bonus as dead money (pre-June 1: all now; post-June 1: this
  // year's share now, the rest next year). The new team takes base/roster/other salary and the guarantees.
  function tradeCost(p, year, postJune1) {
    var rem = remaining(p, year);
    var dead = {};
    if (rem.length) {
      if (!postJune1) dead[year] = sum(rem, function (r) { return r.pro; });
      else { dead[year] = rem[0].pro; var n = sum(rem.slice(1), function (r) { return r.pro; }); if (n) dead[year + 1] = n; }
    }
    var newYears = rem.map(function (r) {
      var n = { y: r.y, base: r.base, pro: 0, opt: opt(r), roster: r.roster, other: r.other, gtd: r.gtd };
      if (r.void) n.void = true;
      return recalc(n);
    }).filter(function (r) { return !r.void || r.cap > 0; });
    return { dead: dead, oldSavings: (rem[0] ? rem[0].cap : 0) - (dead[year] || 0), newYears: newYears, newHit: newYears[0] ? newYears[0].cap : 0 };
  }

  // ---- Building a new contract from an offer ----
  // offer = {years, total, bonus, gtd} in $K. Salary escalates ~5% a year after a low first-year base
  // (the usual way teams create cap room). Guarantees cover the signing bonus first, then salary in order.
  function buildContract(offer, startYear, exp) {
    var n = Math.max(1, Math.min(7, offer.years | 0));
    var total = Math.max(0, offer.total | 0);
    var bonus = Math.max(0, Math.min(total, offer.bonus | 0));
    var gtd = Math.max(bonus, Math.min(total, offer.gtd | 0));
    var proYears = Math.min(n, MAX_PRORATION_YEARS);
    var salaryPool = total - bonus;
    // escalating weights; first year slightly lower when there's a bonus
    var w = [];
    for (var i = 0; i < n; i++) w.push(Math.pow(1.05, i));
    var ws = w.reduce(function (a, b) { return a + b; }, 0);
    var years = [], assigned = 0, gtdSalary = gtd - bonus, proAssigned = 0;
    for (var j = 0; j < n; j++) {
      var y = startYear + j;
      var base = j === n - 1 ? salaryPool - assigned : Math.round(salaryPool * w[j] / ws);
      var floor = minSalary((exp | 0) + j, y);
      years.push({ y: y, base: base, pro: 0, opt: 0, roster: 0, other: 0, gtd: 0, cap: 0, _floor: floor });
      assigned += base;
    }
    // enforce league minimum on each year by pulling from later years
    for (var a = 0; a < n; a++) {
      var need = years[a]._floor - years[a].base;
      for (var b = n - 1; need > 0 && b > a; b--) {
        var give = Math.min(need, years[b].base - years[b]._floor);
        if (give > 0) { years[b].base -= give; years[a].base += give; need -= give; }
      }
      if (need > 0) years[a].base += need;   // total was below the league minimum: raise it
      delete years[a]._floor;
    }
    for (var k = 0; k < n; k++) {
      var r = years[k];
      if (k < proYears) {
        r.pro = k === proYears - 1 ? bonus - proAssigned : Math.round(bonus / proYears);
        proAssigned += r.pro;
      }
      var g = Math.min(gtdSalary, r.base);
      r.gtd = g; gtdSalary -= g;
      recalc(r);
    }
    return years;
  }

  // Extension: years still on the old deal keep their prorated bonus; the new money replaces their salary
  // and the new deal runs `offer.years` seasons from startYear (counting the old remaining years).
  function buildExtension(p, offer, startYear) {
    var newYears = buildContract(offer, startYear, p.exp);
    var old = remaining(p, startYear);
    old.forEach(function (o) {
      var r = newYears.filter(function (x) { return x.y === o.y; })[0];
      if (r) { r.pro += o.pro; r.opt = opt(o); recalc(r); }
      else newYears.push(recalc({ y: o.y, base: 0, pro: o.pro, opt: opt(o), roster: 0, other: 0, gtd: 0, void: true })); // old proration beyond new term

function aiFillRoster(target, teams) {
  (teams || aiTeams()).forEach(function (abbr) {
    var need = (target - roster(abbr).length) * 1100;
    if (need > 0 && (abbr !== S.user || S.autopilot)) aiCapFix(abbr, need);
    var guard = 0, slots = target - roster(abbr).length;
    // if the normal plan doesn't fit the room, fill frugally (minimum-ish players) so as many spots as
    // possible get filled
    var avail = abbr === S.user && !S.autopilot ? Math.min(space(abbr), fullSpace(abbr)) : space(abbr);
    var frugal = slots > 0 && planFill(abbr, slots, avail) > avail;
    while (roster(abbr).length < target && guard++ < 80) {
      var counts = {};
      roster(abbr).forEach(function (p) { counts[p.pos] = (counts[p.pos] || 0) + 1; });
      var pos = fillNeedPos(counts);
      var ch = fillChoice(pos, fillBudget(space(abbr), target - roster(abbr).length), null, frugal);
      var p = ch.p, price = ch.price;
      var fillPrice = Cap.minSalary(FILLER_PRICE_EXP, S.year);
      // the user's auto-fill must still fit at week 1, when every contract counts (not just the top 51);
      // if the first choice doesn't fit, fall back to an undrafted rookie at the minimum
      var userRoom = abbr === S.user && !S.autopilot ? fullSpace(abbr) : Infinity;
      if (p && price > userRoom) p = null;
      if (!p) { if (fillPrice > userRoom) break; p = makeFiller(pos); price = fillPrice; }
      var r = sign(p, abbr, { years: 1, total: price, bonus: 0, gtd: 0 }, true);

// AI teams with lots of room pre-pay future salary so unused space doesn't pile up via rollover.

      .sort(byKey(function (p) { return Cap.capHit(p, S.year + 1); }, true))

      var surplus = cnt - depthTarget(p.pos) + 1;

    }).filter(function (x) { return x.ok; }).sort(byKey(function (x) { return x.s; }));

// ---------- room needed to fill 53 ----------
function pickNumberEstimate(k) {
  if (k.no) return k.no;

  return (k.round - 1) * 32 + (i >= 0 ? i + 1 : 16);
}
function unsignedPicks(abbr) {

  return S.picks.filter(function (k) {
    return k.owner === abbr && k.year === S.year && !(S.draft && S.draft.order.indexOf(k.id) >= 0 && S.draft.order.indexOf(k.id) < S.draft.i);
  }).sort(byKey(pickNumberEstimate));

// What it costs to have 53 players at week 1 (when every contract counts): unsigned draft picks at their

// to be added (e.g. the free agent in an offer); `extraHit` = their first-year cap hit.
function rosterFill(abbr, extraSigned, extraHit, extraPos) {

  });

  var preDraft = S.phase === 'resign' || S.phase === 'fa' || S.phase === 'draft';
  var minCost = !open ? 0 : preDraft ? open * Cap.minSalary(0, S.year) : planFill(abbr, open, room - pickCost, extraPos, true);
  var need = pickCost + minCost;

// Best ways to make room: biggest restructure savings, and cuts that free the most for the least talent.
function makeRoomOptions(abbr) {
  var ros = roster(abbr);
  var rs = ros.map(function (p) { var m = Cap.restructureMax(p, S.year, p.exp), n = Math.min(5, Cap.remaining(p, S.year).length); return { p: p, saves: m - Math.floor(m / Math.max(1, n)) }; })
    .filter(function (x) { return x.saves > 500; }).sort(byKey(function (x) { return x.saves; }, true)).slice(0, 3);
  // cuts: a cut opens a spot that must be refilled at the minimum, so what matters is NET room (savings
  // minus that replacement). Never players rated 80+; cuts netting under $250K hidden; backups by net room,
  // then starters by net room.
  var repl = Cap.minSalary(FILLER_PRICE_EXP, S.year);

      var pv = releasePreview(p, false), starter = starters(abbr, p.pos).indexOf(p) >= 0;
      return { p: p, saves: pv.savings, replacement: repl, net: pv.savings - repl, dead: pv.now, starter: starter };
    })
    .filter(function (x) { return x.net >= 250; })
    .sort(function (a, b) { return (a.starter - b.starter) || (b.net - a.net); }).slice(0, 5);
  // how many of the listed cuts (in order) it takes to cover the current shortfall
  var short = rosterFill(abbr).short, cum = 0, cutsNeeded = 0;

  return { restructures: rs, cuts: cuts, short: short, cutsNeeded: short > 0 && cum >= short ? cutsNeeded : (short > 0 ? null : 0), cutsTotal: sumBy(cuts, function (x) { return x.net; }) };

// Schedule, game sim from team strength, injuries, stats, standings, playoffs.
var WEEKS = 17;

function makeSchedule() {
  // 17 rounds, each a perfect matching of all 32 teams: 6 division rounds + 11 non-division rounds.
  var abbrs = TEAMS.map(function (t) { return t.abbr; });
  var divs = {};
  TEAMS.forEach(function (t) { (divs[t.conf + t.div] = divs[t.conf + t.div] || []).push(t.abbr); });
  var rounds = [];
  var rr = [[[0, 1], [2, 3]], [[0, 2], [1, 3]], [[0, 3], [1, 2]]];
  for (var leg = 0; leg < 2; leg++) rr.forEach(function (pairs) {
    var games = [];
    Object.keys(divs).forEach(function (d) {
      pairs.forEach(function (pr) {
        var a = divs[d][pr[0]], b = divs[d][pr[1]];
        games.push(leg ? { h: b, a: a } : { h: a, a: b });
      });
    });
    rounds.push(games);
  });
  var met = {};
  function key(a, b) { return a < b ? a + b : b + a; }
  function sameDiv(a, b) { return TEAM[a].conf === TEAM[b].conf && TEAM[a].div === TEAM[b].div; }
  var homeCount = {};
  abbrs.forEach(function (a) { homeCount[a] = 3; });
  for (var r = 0; r < 11; r++) {
    for (var attempt = 0; attempt < 400; attempt++) {
      var left = RNG.shuffle(abbrs.slice()), games = [], okRound = true;
      while (left.length) {
        var a = left.shift();
        var idx = -1;
        for (var j = 0; j < left.length; j++) if (!sameDiv(a, left[j]) && !met[key(a, left[j])]) { idx = j; break; }
        if (idx < 0) { okRound = false; break; }
        var b = left.splice(idx, 1)[0];
        var home = homeCount[a] <= homeCount[b] ? a : b, away = home === a ? b : a;
        games.push({ h: home, a: away });
      }
      if (okRound) {
        games.forEach(function (g) { met[key(g.h, g.a)] = 1; homeCount[g.h]++; });
        rounds.push(games);
        break;
      }
    }
  }
  // interleave: spread division games across the season
  var order = [6, 0, 7, 8, 1, 9, 10, 2, 11, 12, 13, 3, 14, 15, 4, 16, 5];
  S.schedule = order.filter(function (i) { return rounds[i]; }).map(function (i) { return rounds[i].map(function (g) { return { h: g.h, a: g.a, hs: null, as: null }; }); });
}

function resetSeason() {
  Object.keys(S.teams).forEach(function (a) { S.teams[a].rec = newRec(); });
  S.players.forEach(function (p) { p.s = {}; });
  S.week = 0; S.playoffs = null;
  makeSchedule();
}

// ---------- one game ----------
function simGame(home, away, neutral) {
  var H = teamRating(home), A = teamRating(away);
  var hfa = neutral ? 0 : 1.6;
  var hExp = 22 + (H.off - A.def) * 0.55 + (H.st - A.st) * 0.05 + hfa / 2;
  var aExp = 22 + (A.off - H.def) * 0.55 + (A.st - H.st) * 0.05 - hfa / 2;
  var hs = Math.max(0, Math.round(hExp + RNG.normal() * 9.5));
  var as = Math.max(0, Math.round(aExp + RNG.normal() * 9.5));
  hs = footballScore(hs); as = footballScore(as);
  if (hs === as) { // overtime
    var r = RNG.next();
    var pH = 0.5 + (H.ovr - A.ovr) * 0.01;
    if (r < 0.06 && !neutral) {} else if (r < 0.06 + 0.94 * pH) hs += RNG.next() < 0.6 ? 3 : 6; else as += RNG.next() < 0.6 ? 3 : 6;
  }
  gameStats(home, hs, as); gameStats(away, as, hs);
  injuries(home); injuries(away);
  return { hs: hs, as: as };
}
function footballScore(x) { var bad = { 1: 0, 2: 3, 4: 3, 5: 6, 8: 7, 11: 10, 12: 13, 15: 14, 18: 17, 19: 20, 22: 21, 25: 24, 26: 27, 29: 28, 32: 31, 33: 34, 36: 35, 39: 38, 40: 41, 43: 42 }; return bad[x] != null ? bad[x] : x; }

function add(p, k, v) { p.s[k] = (p.s[k] || 0) + v; }
function gameStats(abbr, pts, ptsAgainst) {
  var qb = starters(abbr, 'QB')[0], rb = starters(abbr, 'RB'), wr = starters(abbr, 'WR'), te = starters(abbr, 'TE'), k = starters(abbr, 'K')[0];
  var lineup = [];
  ['QB', 'RB', 'WR', 'TE', 'OT', 'IOL', 'EDGE', 'DL', 'LB', 'CB', 'S', 'K', 'P'].forEach(function (pos) { lineup = lineup.concat(starters(abbr, pos)); });
  lineup.forEach(function (p) { add(p, 'g', 1); });
  var td = Math.max(0, Math.round(pts / 7.6 + RNG.normal() * 0.4));
  var fg = Math.max(0, Math.round((pts - td * 7) / 3));
  var passYds = Math.max(60, Math.round(205 + (qb ? (qb.ovr - 75) * 3 : -40) + (pts - 21) * 3 + RNG.normal() * 45));
  var rushYds = Math.max(20, Math.round(110 + (pts - 21) * 1.5 + RNG.normal() * 30));
  var passTd = Math.round(td * 0.62), rushTd = td - passTd;
  if (qb) {
    add(qb, 'pyd', passYds); add(qb, 'ptd', passTd);
    add(qb, 'int', RNG.next() < 0.55 - (qb.ovr - 70) * 0.012 ? (RNG.next() < 0.25 ? 2 : 1) : 0);
    add(qb, 'att', Math.round(passYds / 7.1));
  }
  var targets = [[wr[0], 0.27], [wr[1], 0.2], [te[0], 0.17], [wr[2], 0.12], [rb[0], 0.1]].filter(function (x) { return x[0]; });
  var tw = sumBy(targets, function (x) { return x[1]; });
  targets.forEach(function (x) {
    var share = x[1] / tw * (0.85 + RNG.next() * 0.3);
    add(x[0], 'rec', Math.round(passYds * share / 11.5)); add(x[0], 'ryd', Math.round(passYds * share));
  });
  for (var i = 0; i < passTd; i++) { var t = weighted(targets); if (t) add(t, 'rtd', 1); }
  if (rb[0]) { add(rb[0], 'car', Math.round(rushYds * 0.7 / 4.4)); add(rb[0], 'ruyd', Math.round(rushYds * 0.7)); add(rb[0], 'rutd', rushTd); }
  if (k) { add(k, 'fgm', fg); add(k, 'fga', fg + (RNG.next() < 0.3 ? 1 : 0)); }

  var rushers = starters(abbr, 'EDGE').map(function (p) { return [p, p.ovr / 30]; }).concat(starters(abbr, 'DL').map(function (p) { return [p, p.ovr / 60]; }));
  var sacks = Math.max(0, Math.round(2.4 + RNG.normal() * 1.3));
  for (var s = 0; s < sacks; s++) { var r = weighted(rushers); if (r) add(r, 'sk', 1); }
  var dbs = starters(abbr, 'CB').concat(starters(abbr, 'S')).map(function (p) { return [p, 1]; });
  var ints = RNG.next() < 0.6 ? RNG.int(1, 2) - (RNG.next() < 0.5 ? 1 : 0) : 0;
  for (var n = 0; n < ints; n++) { var d = weighted(dbs); if (d) add(d, 'dint', 1); }
  starters(abbr, 'LB').forEach(function (p) { add(p, 'tk', RNG.int(4, 10)); });
  starters(abbr, 'S').forEach(function (p) { add(p, 'tk', RNG.int(3, 7)); });

}
function weighted(list) {

  return list.length ? list[list.length - 1][0] : null;
}

function injuries(abbr) {

    var risk = 0.016 * (p.pos === 'RB' ? 1.5 : p.pos === 'K' || p.pos === 'P' || p.pos === 'LS' ? 0.2 : 1) * (p.age >= 31 ? 1.3 : 1);
    if (starters(abbr, p.pos).indexOf(p) < 0) risk *= 0.3;
    if (RNG.next() < risk) {
      var r = RNG.next();
      p.inj = r < 0.55 ? RNG.int(1, 2) : r < 0.85 ? RNG.int(3, 6) : r < 0.95 ? RNG.int(7, 10) : 99;
      p.injNote = p.inj === 99 ? 'Out for season' : 'Out ' + p.inj + ' wk';
      if (abbr === S.user || p.ovr >= 85) news(p.pos + ' ' + p.name + ' (' + abbr + ') injured: ' + (p.inj === 99 ? 'out for the season' : 'out ' + p.inj + ' week' + (p.inj > 1 ? 's' : '')) + '.', abbr);

function record(home, away, hs, as) {

  H.pf += hs; H.pa += as; A.pf += as; A.pa += hs;
  var sd = TEAM[home].div === TEAM[away].div && TEAM[home].conf === TEAM[away].conf, sc = TEAM[home].conf === TEAM[away].conf;
  if (hs > as) { H.w++; A.l++; if (sd) { H.dw++; A.dl++; } if (sc) { H.cw++; A.cl++; } }
  else if (as > hs) { A.w++; H.l++; if (sd) { A.dw++; H.dl++; } if (sc) { A.cw++; H.cl++; } }
  else { H.t++; A.t++; }

function simWeek() {
  if (S.week >= WEEKS) return false;
  // options due this league year are exercised once games start
  if (S.week === 0) S.players.forEach(function (p) { if (p.team) Cap.exerciseOptions(p, S.year); });
  Object.keys(S.teams).forEach(function (a) { if (a !== S.user) autoDepth(a); });
  S.schedule[S.week].forEach(function (g) {
    var r = simGame(g.h, g.a);
    g.hs = r.hs; g.as = r.as;
    record(g.h, g.a, r.hs, r.as);
  });

  S.week++;
  return true;

// ---------- standings ----------
function pct(r) { var g = r.w + r.l + r.t; return g ? (r.w + r.t / 2) / g : 0; }
function standingSort(a, b) {
  var ra = S.teams[a].rec, rb = S.teams[b].rec;
  return (pct(rb) - pct(ra)) || ((rb.dw - rb.dl) - (ra.dw - ra.dl)) * 0 || ((rb.cw - rb.cl) - (ra.cw - ra.cl)) || ((rb.pf - rb.pa) - (ra.pf - ra.pa)) || (a < b ? -1 : 1);
}
function divisionStandings() {

  ['AFC', 'NFC'].forEach(function (c) {
    ['East', 'North', 'South', 'West'].forEach(function (d) {
      out.push({ conf: c, div: d, teams: TEAMS.filter(function (t) { return t.conf === c && t.div === d; }).map(function (t) { return t.abbr; }).sort(standingSort) });
    });
  });
  return out;
}
function seeds(conf) {

  var winners = divs.map(function (d) { return d.teams[0]; }).sort(standingSort);
  var rest = TEAMS.filter(function (t) { return t.conf === conf && winners.indexOf(t.abbr) < 0; }).map(function (t) { return t.abbr; }).sort(standingSort);
  return winners.concat(rest.slice(0, 3));

// ---------- playoffs ----------
function startPlayoffs() {

  ['AFC', 'NFC'].forEach(function (c) { S.playoffs[c].forEach(function (a) { S.playoffs.alive[a] = true; }); });
}
var ROUND_NAMES = ['Wild card', 'Divisional', 'Conference championship', 'Super Bowl'];
function simPlayoffRound() {

  var games = [];

    ['AFC', 'NFC'].forEach(function (c) {
      var alive = po[c].filter(function (a) { return po.alive[a]; });
      var list = po.round === 0 ? alive.slice(1) : alive;   // #1 seed has a bye in the wild-card round

    });
  } else {
    var a = po.AFC.filter(function (x) { return po.alive[x]; })[0], n = po.NFC.filter(function (x) { return po.alive[x]; })[0];
    games.push({ h: a, a: n, neutral: true });
  }
  games.forEach(function (g) {
    var r = simGame(g.h, g.a, g.neutral);
    if (r.hs === r.as) r.hs += 3;
    g.hs = r.hs; g.as = r.as; g.round = po.round;
    var loser = r.hs > r.as ? g.a : g.h;
    po.alive[loser] = false; po.elim[loser] = po.round;
    po.games.push(g);
  });
  healInjuries();
  if (po.round === 3) {
    var last = po.games[po.games.length - 1];
    po.champ = last.hs > last.as ? last.h : last.a;
    news(TEAM[po.champ].name + ' win the Super Bowl (' + Math.max(last.hs, last.as) + '-' + Math.min(last.hs, last.as) + ').');
  }
  po.round++;
  return true;
}

// Phase machine, draft, progression, retirements, contract rollover.

function canAdvance() {
  if (S.phase === 'preseason' && roster(S.user).length > ROSTER_MAX) return 'Cut your roster to ' + ROSTER_MAX + ' first (you have ' + roster(S.user).length + '), or use auto cut.';
  if (S.phase === 'preseason' && roster(S.user).length < 46) return 'You need at least 46 players to start the season (you have ' + roster(S.user).length + '). Sign free agents.';
  if (S.phase === 'draft' && S.draft && S.draft.i < S.draft.order.length) return 'Finish the draft first.';
  if (S.phase === 'draft' && !S.autopilot && pendingOptions(S.user).length) return 'Decide on the fifth-year option for ' + pendingOptions(S.user).map(function (p) { return p.name; }).join(', ') + ' (deadline: early May).';
  if (S.phase === 'preseason' && fullSpace(S.user) < 0) return 'From week 1 every contract counts, not just the top 51: you\'d be ' + fmtM(-fullSpace(S.user)) + ' over the cap.';
  if (S.phase === 'fa' && space(S.user) < 0) return 'You are over the cap. Clear space before moving on.';
  return null;
}

function advance() {
  var block = canAdvance();
  if (block) return { ok: false, msg: block };
  switch (S.phase) {
    case 'resign':
      aiResign();
      S.phase = 'fa'; S.faDay = 0;
      news('Free agency is open. ' + freeAgents().filter(function (p) { return p.ovr >= 75; }).length + ' players rated 75+ are available.');
      break;
    case 'fa':
      if (S.faDay < FA_DAYS) { aiFreeAgencyDay(); S.faDay++; if (S.faDay < FA_DAYS) break; }
      startDraft(); S.phase = 'draft';
      break;
    case 'draft':
      aiFifthYearDecisions();
      finishDraft(); S.phase = 'preseason';
      aiFillRoster(ROSTER_MAX);
      aiTeams().forEach(function (a) { cutdown(a); autoDepth(a); });
      news('Preseason: get to ' + ROSTER_MAX + ' players before week 1.');
      break;
    case 'preseason':
      aiFreeAgencyDay(); aiLateMarket(); aiExtensions();
      aiFillRoster(ROSTER_MAX);
      aiTeams().forEach(function (a) { cutdown(a); });
      aiLateMarket();                          // second pass: cutdowns free room for anyone still unsigned
      aiTeams().forEach(function (a) { cutdown(a); });
      S.phase = 'season';                      // top-51 rule ends: every contract counts now
      aiTeams().forEach(function (a) { aiCapFix(a, 500); });
      aiPrepay(15000);
      resetSeason();
      break;
    case 'season':
      if (S.week < WEEKS) { simWeek(); aiInSeason(); break; }
      selectProBowls();
      startPlayoffs(); S.phase = 'playoffs';
      news('Playoff field set. AFC: ' + S.playoffs.AFC.join(', ') + '. NFC: ' + S.playoffs.NFC.join(', ') + '.');
      break;
    case 'playoffs':
      if (!S.playoffs.champ) { simPlayoffRound(); break; }
      endOfYear();
      break;
  }
  return { ok: true };
}

// in-season: AI teams replace injured starters with free agents now and then
function aiInSeason() {
  aiTeams().forEach(function (abbr) {
    POSITIONS.forEach(function (pos) {
      if (starters(abbr, pos).length < Market.STARTERS[pos] && roster(abbr).length < ROSTER_MAX + 1) {
        var fa = freeAgents().filter(function (p) { return p.pos === pos; }).sort(byKey(function (p) { return p.ovr; }, true))[0];
        if (fa && roster(abbr).length >= ROSTER_MAX) cutdownOne(abbr, pos);
        if (fa) sign(fa, abbr, { years: 1, total: Cap.minSalary(fa.exp, S.year) + 100, bonus: 0, gtd: 0 }, true);
      }
    });
  });
}
function cutdownOne(abbr, avoidPos) {
  var c = roster(abbr).filter(function (p) { return p.pos !== avoidPos && !p.inj; }).sort(byKey(function (p) { return p.ovr + releasePreview(p).now / 1000; }))[0];
  if (c && space(abbr) + releasePreview(c).savings >= 0) release(c, false);
}

// ---------- draft ----------
var CLASS_POS = { QB: 12, RB: 22, WR: 40, TE: 18, OT: 26, IOL: 28, EDGE: 34, DL: 30, LB: 26, CB: 36, S: 22, K: 3, P: 3, LS: 2 };
function genDraftClass(year) {
  var list = [];
  Object.keys(CLASS_POS).forEach(function (pos) { for (var i = 0; i < CLASS_POS[pos]; i++) list.push(pos); });
  var out = list.map(function (pos) {
    var z = RNG.normal();
    var g = clamp(z, -2.5, 3.2);
    var age = RNG.int(21, 23);
    var boost = (S.classBoost || {})[pos] || 0;               // class strength at this position
    var ovr = clamp(Math.round(54 + g * 7 + boost * 0.4 + RNG.normal() * 2), 40, 86);
    var pot = clamp(Math.round(ovr + 8 + RNG.next() * 14 + Math.max(0, g) * 3 + boost * 0.8), ovr, 99);
    var p = { id: 'D' + year + '-' + (S.nextId++), name: fakeName(), pos: pos, opos: pos, age: age, team: null, prevTeam: null,
              exp: 0, draft: [year, 0, 0], apy: 0, signed: year, gtdTotal: 0, years: [], options: [], status: 'Prospect',
              ovr: ovr, pot: pot, sub: {}, inj: 0, s: {}, car: {}, rej: 0, prospect: true, gen: true,
              college: RNG.pick(['Alabama', 'Georgia', 'Ohio State', 'Michigan', 'LSU', 'Texas', 'Oregon', 'USC', 'Clemson', 'Penn State', 'Florida', 'Notre Dame', 'Miami', 'Utah', 'Iowa', 'Wisconsin', 'Tennessee', 'Washington', 'Oklahoma', 'Auburn', 'Boise State', 'Toledo', 'App State', 'Tulane', 'Missouri', 'Kansas State']) };
    p.grade = prospectGrade(p);
    return p;
  });
  out.sort(byKey(function (p) { return p.grade; }, true));
  return out;
}
function prospectGrade(p) { return (p.ovr * 0.55 + p.pot * 0.45) * (0.9 + Market.POS_WEIGHT[p.pos] * 0.05); }

function draftOrderTeams() {
  if (S.lastOrder) return S.lastOrder.slice();

  // the Super Bowl is in the data, provisional (current standings) before that
  if (BASE.draftOrder && BASE.draftOrder.length === 32) return BASE.draftOrder.slice();

}
function startDraft() {
  var order = draftOrderTeams();
  var picks = S.picks.filter(function (k) { return k.year === S.year; });
  picks.sort(function (a, b) { return a.round - b.round || order.indexOf(a.orig) - order.indexOf(b.orig); });
  picks.forEach(function (k, i) { k.no = i + 1; });
  // number next year's picks as "projected" by round only
  var cls = genDraftClass(S.year);

  news('The ' + S.year + ' draft is on. ' + (picks.filter(function (k) { return k.owner === S.user; }).length) + ' picks for ' + S.user + '.');
}
function draftPool() { return S.players.filter(function (p) { return p.prospect && !p.team; }).sort(byKey(function (p) { return p.grade; }, true)); }
function currentPick() { return S.draft && S.draft.i < S.draft.order.length ? S.picks.filter(function (k) { return k.id === S.draft.order[S.draft.i]; })[0] : null; }
function makePick(k, p) {
  var deal = Cap.rookieDeal(k.no, S.year, capOf(S.year));
  p.prospect = false; p.draft = [S.year, k.round, k.no]; p.status = 'ACT';
  p.team = null;
  var yrs = Cap.buildContract(deal, S.year, 0);
  p.team = k.owner; p.years = yrs; p.apy = Cap.apy(yrs); p.gtdTotal = deal.gtd; p.signed = S.year;
  p.mv = Market.initialMarketShare(p, k.no);
  S.draft.made.push({ no: k.no, round: k.round, team: k.owner, id: p.id });
  S.draft.i++;
  if (k.owner === S.user || k.round === 1) news('Pick ' + k.no + ': ' + k.owner + ' select ' + p.pos + ' ' + p.name + ' (' + p.college + ').', k.owner);
}
function aiPick(k) {
  var pool = draftPool().slice(0, 40);
  var best = null, bs = -1;
  pool.forEach(function (p, i) {
    var lift = needAt(k.owner, p.pos, p.pot - 6);
    var s = p.grade + Math.min(8, lift * 0.25) * Market.POS_WEIGHT[p.pos] - i * 0.15 + RNG.next() * 2;
    if (p.pos === 'K' || p.pos === 'P' || p.pos === 'LS') s -= k.round < 5 ? 25 : 0;
    if (s > bs) { bs = s; best = p; }
  });

}
// Advance the draft until it's the user's pick (or it ends). Returns true if the user is on the clock.
function draftUntilUser(includeUser) {
  while (S.draft.i < S.draft.order.length) {
    var k = currentPick();
    if (k.owner === S.user && !includeUser) return true;
    if (k.owner === S.user) { aiPick(k); continue; }
    aiPick(k);
  }

}
function finishDraft() {

  draftUntilUser(true);
  // undrafted prospects become free agents asking for the minimum
  S.players.forEach(function (p) { if (p.prospect) { p.prospect = false; p.status = 'UDFA'; p.ovr = Math.min(p.ovr, 62); } });
  S.picks = S.picks.filter(function (k) { return k.year !== S.year; });
  addPicks(S.year + 3);
  TEAMS.forEach(function (t) { autoDepth(t.abbr); });
}

// ---------- end of year ----------
// Progression = age curve + how he actually played this season. No random drift: a rating moves only
// because of aging (growth toward potential when young, decline past the position's peak) and
// performance (production vs what his rating predicted, among players with 6+ starts).
function perfScore(p) {
  var s = p.s || {}, g = s.g || 0;
  if (g < 6) return null;
  switch (p.pos) {
    case 'QB': return ((s.pyd || 0) + 20 * (s.ptd || 0) - 45 * (s.int || 0)) / g;
    case 'RB': return ((s.ruyd || 0) + (s.ryd || 0) + 6 * ((s.rutd || 0) + (s.rtd || 0))) / g;
    case 'WR': case 'TE': return ((s.ryd || 0) + 6 * (s.rtd || 0)) / g;
    case 'EDGE': case 'DL': return (s.sk || 0) / g;
    case 'LB': return (s.tk || 0) / g;
    case 'CB': case 'S': return ((s.dint || 0) * 3 + (s.tk || 0) * 0.2) / g;
    case 'K': return s.fga ? (s.fgm || 0) / s.fga : null;
    default: return null;   // OL, P, LS: no stat that separates them in this sim
  }
}
function performanceDeltas() {
  var out = {};
  POSITIONS.forEach(function (pos) {
    var list = S.players.filter(function (p) { return p.pos === pos && !p.retired && perfScore(p) != null; });
    if (list.length < 8) return;
    var n = list.length;
    var byPerf = list.slice().sort(byKey(perfScore)), byOvr = list.slice().sort(byKey(function (p) { return p.ovr; }));
    var rp = {}, ro = {};
    byPerf.forEach(function (p, i) { rp[p.id] = i / (n - 1); });
    byOvr.forEach(function (p, i) { ro[p.id] = i / (n - 1); });
    list.forEach(function (p) { out[p.id] = (rp[p.id] - ro[p.id]) * 6; });   // -6..+6
  });
  return out;
}
function progress(p, perf) {
  var pk = Market.PEAK[p.pos] || [25, 30];
  var d;
  var gap = Math.max(0, p.pot - p.ovr);
  if (p.age < pk[0]) d = Math.min(7, gap * 0.35) + perf * 0.6;                 // developing
  else if (p.age < pk[0] + 3) d = Math.min(4, gap * 0.25) + perf * 0.6;       // early prime: still growing
  else if (p.age <= pk[1]) d = perf * 0.6;
  else d = -(1.5 + (p.age - pk[1]) * 1.1) + perf * 0.4;
  p.ovr = clamp(Math.round(p.ovr + d), 30, 99);
  p.pot = Math.max(p.ovr, Math.round(p.pot + (p.age < pk[0] + 3 ? perf * 0.4 : -2)));
  p.age++; p.exp++;
}

// Pro Bowl: best per position in each conference by rating and this season's production.
var PRO_BOWL_SLOTS = { QB: 3, RB: 3, WR: 4, TE: 2, OT: 3, IOL: 4, EDGE: 3, DL: 3, LB: 3, CB: 4, S: 3, K: 1, P: 1, LS: 1 };
function selectProBowls() {
  var perf = performanceDeltas(), picked = [];
  ['AFC', 'NFC'].forEach(function (conf) {
    POSITIONS.forEach(function (pos) {
      S.players.filter(function (p) { return p.team && TEAM[p.team].conf === conf && p.pos === pos && (p.s.g || 0) >= 8; })
        .sort(byKey(function (p) { return p.ovr + (perf[p.id] || 0) * 1.5; }, true)).slice(0, PRO_BOWL_SLOTS[pos])
        .forEach(function (p) { p.pb = (p.pb || 0) + 1; (p.pbYears = p.pbYears || []).push(S.year); picked.push(p); });
    });
  });
  var mine = picked.filter(function (p) { return p.team === S.user; });
  news('Pro Bowl rosters announced' + (mine.length ? ': ' + mine.map(function (p) { return p.name; }).join(', ') + ' from your team.' : '.'));
}
function retires(p) {
  var pk = (Market.PEAK[p.pos] || [25, 30])[1];
  var over = p.age - pk;
  var prob = over <= 0 ? 0.005 : Math.min(0.95, 0.06 * over + (p.ovr < 65 ? 0.2 : 0) + (p.age >= 36 ? 0.3 : 0));
  if (!p.team && p.age >= 30) prob += 0.25;          // unsigned vets often hang it up
  if (p.ovr >= 88 && p.age <= 38) prob *= 0.4;
  return RNG.next() < prob;
}

function endOfYear() {
  var po = S.playoffs, Y = S.year;
  var ur = S.teams[S.user].rec;
  S.history.push({ year: Y, champ: po.champ, user: S.user, rec: ur.w + '-' + ur.l + (ur.t ? '-' + ur.t : ''),
                   userFinish: po.champ === S.user ? 'Won Super Bowl' : po.elim[S.user] != null ? 'Lost in ' + ROUND_NAMES[po.elim[S.user]].toLowerCase() : 'Missed playoffs',
                   mvp: seasonMvp() });
  // next draft order: non-playoff teams by record, then playoff teams by round lost, champ last
  var all = TEAMS.map(function (t) { return t.abbr; });
  all.sort(function (a, b) {
    var ea = po.champ === a ? 9 : po.elim[a] != null ? po.elim[a] + 1 : 0, eb = po.champ === b ? 9 : po.elim[b] != null ? po.elim[b] + 1 : 0;
    return ea - eb || (pct(S.teams[a].rec) - pct(S.teams[b].rec)) || ((S.teams[a].rec.pf - S.teams[a].rec.pa) - (S.teams[b].rec.pf - S.teams[b].rec.pa));
  });
  S.lastOrder = all;
  // career stats; playing time for first-round picks' option tiers (share of games started)
  S.players.forEach(function (p) {
    Object.keys(p.s || {}).forEach(function (k) { p.car[k] = (p.car[k] || 0) + p.s[k]; }); p.last = p.s;
    if (p.draft && p.draft[1] === 1 && p.draft[0] >= Y - 2) { p.pt = p.pt || {}; p.pt[Y] = Math.round(Math.min(1, (p.s.g || 0) / WEEKS) * 1000) / 1000; }
  });
  // fifth-year option salary table for next league year, from this year's cap numbers
  S.optTables = S.optTables || {};
  S.optTables[Y + 1] = Cap.optionTable(S.players, Y, BASE.optGroup, 1.07);
  var perf = performanceDeltas();
  // cap rollover into next league year
  TEAMS.forEach(function (t) { Cap.rollover(S.players, T(t.abbr), Y); });
  var retired = [];
  S.players.forEach(function (p) {
    if (p.retired) return;
    if (retires(p)) {
      if (p.team) { var c = Cap.releaseCost(p, Y + 1, false); Cap.applyDead(T(p.team), c.dead); }
      p.retired = Y; p.retiredFrom = p.team; p.team = null; p.years = []; p.options = [];
      retired.push(p);
      return;
    }
    progress(p, perf[p.id] || 0);

  if (retired.length) news(retired.length + ' players retired, including ' + retired.sort(byKey(function (p) { return p.ovr; }, true)).slice(0, 4).map(function (p) { return p.name; }).join(', ') + '.');
  // keep the save small: unsigned veterans who sat out a year retire; drop retired non-notables
  S.players.forEach(function (p) {
    if (!p.team && !p.retired && !p.rights && (p.ovr < 58 || p.age >= 32 || (p.gen && p.ovr < 62))) { p.retired = Y; p.retiredFrom = null; }
  });
  S.players = S.players.filter(function (p) { return !p.retired || (p.ovr >= 85 && !p.gen); });
  S.players.forEach(function (p) { if (p.retired) { p.years = []; p.s = {}; p.sub = {}; } });
  S.year = Y + 1;

  S.players.forEach(function (p) {
    if (!p.team) return;

    if (Cap.yearsLeft(p, S.year) === 0) { p.rights = p.team; p.prevTeam = p.team; p.team = null; p.years = []; p.options = []; }
  });
  S.june1 = {};
  TEAMS.forEach(function (t) { T(t.abbr); autoDepth(t.abbr); S.teams[t.abbr].rec = newRec(); });
  S.phase = 'resign'; S.week = 0; S.playoffs = null; S.draft = null; S.schedule = [];
  reindex();
  var exp = S.players.filter(function (p) { return p.rights === S.user; }).length;
  news('The ' + S.year + ' league year begins. ' + exp + ' of your players have expiring contracts. Cap: ' + fmtM(capOf(S.year)) + ' (projected) plus ' + fmtM(S.teams[S.user].rollover[S.year] || 0) + ' rollover.');
}
// League talent stays stable through the draft, not by editing existing players: every player's
// rating moves only for aging and performance. Each offseason, positions with fewer 80+ players
// than at the start get a stronger incoming class (and vice versa).
function talentCount(pos) { return S.players.filter(function (p) { return p.pos === pos && !p.retired && !p.prospect && p.ovr >= 80; }).length; }
// forward-looking: players projected to be 80+ two seasons out (counts the young pipeline, reduces lag)
function pipelineCount(pos) { return S.players.filter(function (p) { return p.pos === pos && !p.retired && !p.prospect && Market.projOvr(p, 2) >= 80; }).length; }

    var target = S.targetPipe[pos] || 0, cur = pipelineCount(pos);
    var gap = (target - cur) / Math.max(4, target);            // share of the starting 80+ group missing
    S.classBoost[pos] = clamp(2 + gap * 15, -8, 20);   // small baseline lift + proportional to the projected shortfall

}
function seasonMvp() {
  var best = null, bs = -1;
  S.players.forEach(function (p) {
    if (!p.s || !p.s.g) return;
    var v = p.pos === 'QB' ? ((p.s.pyd || 0) / 20 + (p.s.ptd || 0) * 5 - (p.s.int || 0) * 3) * 1.3 : (p.s.ruyd || 0) / 10 + (p.s.ryd || 0) / 10 + ((p.s.rutd || 0) + (p.s.rtd || 0)) * 6 + (p.s.sk || 0) * 8;
    v *= (0.6 + pct(S.teams[p.team] ? S.teams[p.team].rec : newRec()));

// Screens and interaction. Rendering is plain template strings; events are delegated via data-act.
var UI = { view: 'hub', posFilter: 'ALL', sort: 'ovr', faPos: 'ALL', trade: null, modal: null, draftPos: 'ALL', leaders: 'pyd', msg: null };

// ---------- top-level ----------

function statText(s, pos) {
  var parts = [s.g + ' G'];
  if (s.pyd) parts.push(s.pyd + ' pass yds', (s.ptd || 0) + ' TD', (s.int || 0) + ' INT');
  if (s.ruyd) parts.push(s.ruyd + ' rush yds', (s.rutd || 0) + ' rush TD');
  if (s.ryd) parts.push((s.rec || 0) + ' rec', s.ryd + ' rec yds', (s.rtd || 0) + ' TD');
  if (s.sk) parts.push(s.sk + ' sacks');
  if (s.dint) parts.push(s.dint + ' INT');
  if (s.tk) parts.push(s.tk + ' tkl');
  if (s.fga) parts.push(s.fgm + '/' + s.fga + ' FG');
  return parts.join(' · ');
}

    case 'offer-submit': submitOffer(); break;
    case 'depth':
      var arr = S.teams[S.user].depth[d.pos], i = +d.i, j = i + (+d.d);
      if (j >= 0 && j < arr.length) { var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp; } break;
    case 'auto-depth': S.teams[S.user].depth = {}; autoDepth(S.user); break;
    case 'trade-toggle':
      var tr = tradeState(), side = tr[d.side][d.kind], ix = side.indexOf(d.id);
      if (ix >= 0) side.splice(ix, 1); else side.push(d.id);
      tr.result = null; tr.suggestion = null; break;
    case 'trade-with': UI.trade = null; tradeState().give.players.push(d.id); UI.modal = null; UI.view = 'trade'; break;
    case 'trade-for': var pp = P(d.id); UI.trade = null; var ts = tradeState(); ts.ai = pp.team; ts.get.players.push(d.id); UI.modal = null; UI.view = 'trade'; break;
    case 'trade-clear': UI.trade = { ai: tradeState().ai, give: { players: [], picks: [] }, get: { players: [], picks: [] } }; break;
    case 'trade-ask':
      var t2 = tradeState(), w = whatWouldItTake(t2.ai, t2.give, t2.get);
      t2.suggestion = w.done ? 'They already like this deal.' : w.options.length ? t2.ai + ' would do it if you add: ' + w.options.map(function (o) { return o.label; }).join(' or ') + '.' : 'Nothing on your side gets this done. Ask for less or take on salary.';
      break;
    case 'trade-propose':
      var t3 = tradeState(), ev = aiTradeEval(t3.ai, t3.give, t3.get);
      if (ev.accept) { executeTrade(t3.ai, t3.give, t3.get); UI.trade = { ai: t3.ai, give: { players: [], picks: [] }, get: { players: [], picks: [] }, result: { ok: true, text: 'Trade accepted.' } }; }
      else t3.result = { ok: false, text: ev.msg || t3.ai + ' turned it down.' };
      break;
    case 'draft-sim': draftUntilUser(false); break;
    case 'fifth': var fp = P(d.id), fr = decideFifthYear(fp, d.x === '1'); flash(fr.ok ? (d.x === '1' ? 'Option exercised for ' + fp.name + '.' : 'Option declined for ' + fp.name + '.') : fr.msg, !fr.ok); UI.modal = playerModal(d.id); break;
    case 'export': exportSave(); return;
    case 'import': document.getElementById('importfile').click(); return;
    case 'draft-auto': draftUntilUser(true); flash('Draft complete. Rookies are signed to slotted contracts.'); break;
    case 'draft-pick': makePick(currentPick(), P(d.id)); draftUntilUser(false); break;
  }
  render();
}
function onChange(e) {
  var el = e.target;
  if (el.id === 'importfile') { if (el.files && el.files[0]) importSave(el.files[0]); el.value = ''; return; }
  if (el.dataset.act === 'trade-team') { UI.trade = { ai: el.value, give: tradeState().give, get: { players: [], picks: [] } }; render(); return; }
  if (el.dataset.field && UI.offer) {
    var v = parseFloat(el.value); if (isNaN(v)) return;
    UI.offer[el.dataset.field] = el.dataset.field === 'years' ? clamp(Math.round(v), 1, 7) : Math.max(0, v);
    UI.offerErr = null;
    var focus = el.dataset.field;
    render();
    var again = document.querySelector('[data-field="' + focus + '"]'); if (again) { again.focus(); }
  }
}
function submitOffer() {
  var o = UI.offer, p = P(o.id);
  if (!(o.total > 0) || o.years < 1) { UI.offerErr = 'Enter a total and number of years.'; return; }
  if (o.bonus > o.total || o.gtd > o.total) { UI.offerErr = 'Bonus and guarantees can\'t exceed the total.'; return; }
  var offer = { years: o.years, total: Math.round(o.total * 1000), bonus: Math.round(o.bonus * 1000), gtd: Math.round(Math.max(o.gtd, o.bonus) * 1000) };
  var ev = Market.evaluate(p, offer, offerCtx(p, S.user));
  if (!ev.accept) { p.rej = (p.rej || 0) + 1; UI.offerErr = p.name + ' turned it down' + (ev.mood < 0.85 ? ' and was not impressed.' : '.'); return; }
  var r = o.mode === 'extend' ? extend(p, offer) : sign(p, S.user, offer);
  if (!r.ok) { UI.offerErr = r.msg; return; }
  UI.modal = null; UI.offer = null;
  flash(p.name + ' accepted: ' + o.years + ' yr, ' + fmtM(offer.total) + '.');
}

// ---------- save / load ----------
function saveSection() {
  return '<section class="card"><h3>Save</h3><p class="muted small">The game saves in this browser automatically. Export a save file to back it up or move it to another device.</p><div class="actions"><button data-act="export">Export save</button><button data-act="import">Import save</button></div>' + importInput() + '</section>';
}
function importInput() { return '<input type="file" id="importfile" accept=".json,application/json" hidden>'; }
function exportSave() {
  var idx = S._idx; delete S._idx; S.rng = RNG.s;
  var json = JSON.stringify({ app: 'nfl-gm', v: 1, saved: new Date().toISOString(), S: S, BASE: BASE });
  S._idx = idx;
  var url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  var a = document.createElement('a');
  a.href = url; a.download = 'nfl-gm-' + S.user + '-' + S.year + '-' + S.phase + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  flash('Save exported.'); render();
}
function importSave(file) {
  var reader = new FileReader();
  reader.onload = function () {
    try {
      var o = JSON.parse(reader.result);
      if (o.app !== 'nfl-gm' || !o.S || !o.BASE || !o.S.players || !o.S.teams) throw new Error('not a save');
      if (S && !confirm('Load this save (' + o.S.user + ', ' + o.S.year + ')? It replaces the game in progress.')) return;
      S = o.S; BASE = o.BASE; reindex(); Market.setCurve(BASE.curve); Market.setScale(S.payScale || 1); RNG.s = S.rng || S.seed;
      UI.view = 'hub'; UI.modal = null; UI.trade = null;
      flash('Save loaded: ' + TEAM[S.user].name + ', ' + S.year + '.');
      saveGame(); render();
    } catch (e) { alert('That file isn\'t an NFL GM save.'); }
  };
  reader.readAsText(file);
}
var SAVE_KEY = 'nflgm-save-v1', saveTimer = null;
function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }
function scheduleSave() { if (saveTimer) clearTimeout(saveTimer); saveTimer = setTimeout(saveGame, 400); }
function saveGame() {
  if (!S) return;
  try {
    var idx = S._idx; delete S._idx; S.rng = RNG.s;
    var json = JSON.stringify({ S: S, BASE: BASE });
    S._idx = idx;
    localStorage.setItem(SAVE_KEY, window.LZString ? 'lz:' + LZString.compressToUTF16(json) : json);
  } catch (e) { console.warn('save failed', e); flash('Could not save: browser storage is full or blocked.', true); }
}
function loadGame() {
  try {
    var raw = localStorage.getItem(SAVE_KEY); if (!raw) return false;
    var json = raw.slice(0, 3) === 'lz:' ? LZString.decompressFromUTF16(raw.slice(3)) : raw;
    var o = JSON.parse(json);
    S = o.S; BASE = o.BASE; reindex(); Market.setCurve(BASE.curve); Market.setScale(S.payScale || 1); RNG.s = S.rng || S.seed;
    UI.view = 'hub';
    return true;
  } catch (e) { console.warn('load failed', e); return false; }
}

// Boot: load data, restore save, wire events.
var DATA = null;
(function boot() {
  document.addEventListener('click', onClick);
  document.addEventListener('change', onChange);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && UI.modal) { UI.modal = null; UI.offer = null; render(); } });
  fetch('data.json').then(function (r) { return r.json(); }).then(function (d) {
    DATA = d; window.DATA = d; BASE = d.meta;
    render();
  }).catch(function () {
    document.getElementById('app').innerHTML = '<div class="start"><h1>NFL GM</h1><p class="bad">Could not load player data. Reload the page to try again.</p></div>';
  });
})();

</script>
</body>
