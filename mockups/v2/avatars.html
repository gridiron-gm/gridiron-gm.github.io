<!doctype html><html><head><meta charset="utf-8"><title>Avatars</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>body{margin:0;background:#04070d;color:#eef2f8;font:13px Inter,sans-serif;padding:24px}.g{display:grid;grid-template-columns:repeat(8,1fr);gap:14px}.c{text-align:center}.c div{margin-top:4px}.b{background:radial-gradient(circle at 50% 30%,#2a3442,#0a111e);padding:6px;display:inline-block}</style>
</head><body><div class="g" id="g"></div>
<script src="../../src/js/00-util.js"></script><script src="avatar.js"></script>
<script>
Promise.all([fetch('../../src/data.json').then(r=>r.json()), fetch('jerseys.json').then(r=>r.json())]).then(function(a){
  var d=a[0], J=a[1], teams=['NE','KC','PIT','GB','SEA','MIA','CIN','LV','NO','NYJ','DAL','SF','DEN','LAC','MIN','CLE'];
  var out=[]; teams.forEach(function(t){ d.players.filter(function(p){return p.team===t}).sort(function(x,y){return y.ovr-x.ovr}).slice(0,2).forEach(function(p){ p.num=J[p.id]; out.push(p); }); });
  out.push({id:'X1',name:'Free Agent',team:null,num:''});
  document.getElementById('g').innerHTML = out.map(function(p){ return '<div class="c"><span class="b">'+Avatar.svg(p,120)+'</span><div>'+p.name+' #'+(p.num==null?'':p.num)+' '+(p.team||'FA')+'</div></div>'; }).join('');
  document.fonts.ready.then(function(){ setTimeout(function(){ document.title='H:'+document.documentElement.scrollHeight; },200); });
});
</script></body></html>
